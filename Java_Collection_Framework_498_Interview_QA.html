<script>
/* ---------- CONTENT (198 original + 300 additional questions). Format: 'p:' paragraph, 'l:' bullets split by |, 'c:' code ---------- */
const CH=[
{t:"Introduction to the Java Collection Framework",qs:[
["What is the Java Collections Framework (JCF)?","Beginner",["p:A <b>unified architecture</b> in <code>java.util</code> for representing and manipulating groups of objects. It consists of:","l:<b>Interfaces</b> (Collection, List, Set, Queue, Deque, Map) defining behaviour|<b>Implementations</b> (ArrayList, HashMap, TreeSet…) as reusable data structures|<b>Algorithms</b> (sort, binarySearch, shuffle…) in the <code>Collections</code> utility class","p:Benefits: less code to write, interoperability through common interfaces, and well-tested, performant data structures. It was introduced in Java 1.2."]],
["What is the difference between <code>Collection</code> and <code>Collections</code>?","Beginner",["l:<code>Collection</code> is the <b>root interface</b> of List, Set and Queue (Map is not a Collection).|<code>Collections</code> is a <b>final utility class</b> with static methods such as <code>sort</code>, <code>reverse</code>, <code>unmodifiableList</code> and <code>synchronizedList</code>."]],
["Why use collections instead of arrays?","Beginner",["l:Arrays have a <b>fixed size</b>; collections resize dynamically.|Collections offer ready-made operations (search, sort, remove, contains) and different structures (set, queue, map).|Generics give compile-time type safety; arrays are covariant and fail at runtime with <code>ArrayStoreException</code>.","p:Arrays still win for primitives (no boxing) and for tight, fixed-size, performance-critical loops."]],
["Can a collection store primitive values? What happens when you add an <code>int</code>?","Intermediate",["p:No. Collections hold object references only. When you write <code>list.add(5)</code>, the compiler <b>autoboxes</b> the <code>int</code> to an <code>Integer</code>.","c:List&lt;Integer&gt; list = new ArrayList&lt;&gt;();\nlist.add(5);          // autoboxing: Integer.valueOf(5)\nint x = list.get(0);  // unboxing","p:Pitfalls: extra memory and GC pressure for large collections, and a <code>NullPointerException</code> when unboxing a null element. For heavy primitive workloads use arrays or specialised libraries."]]]},
{t:"Collection Hierarchy and Interfaces",qs:[
["Describe the core interface hierarchy. Is <code>Map</code> part of the Collection hierarchy?","Beginner",["c:Iterable\n  └─ Collection\n       ├─ List\n       ├─ Set ── SortedSet ── NavigableSet\n       └─ Queue ── Deque\n\nMap ── SortedMap ── NavigableMap   (separate hierarchy)","p:<code>Map</code> does <b>not</b> extend <code>Collection</code> because it stores key-value pairs. You can still view it as collections through <code>keySet()</code>, <code>values()</code> and <code>entrySet()</code>."]],
["What does the <code>Iterable</code> interface provide?","Beginner",["p:<code>Iterable&lt;T&gt;</code> has one abstract method, <code>iterator()</code>, and is what allows an object to be used in the <b>enhanced for loop</b>. Since Java 8 it also has default methods <code>forEach(Consumer)</code> and <code>spliterator()</code>.","c:for (String s : list) { }          // compiled to iterator() calls\nlist.forEach(System.out::println);   // Java 8+"]],
["Compare List, Set, Queue and Map.","Beginner",["l:<b>List</b>: ordered by index, allows duplicates and positional access.|<b>Set</b>: no duplicates (equality via <code>equals</code>/<code>hashCode</code> or a comparator for sorted sets).|<b>Queue</b>: holds elements for processing, typically FIFO; <b>Deque</b> works at both ends.|<b>Map</b>: unique keys mapped to values; one value per key."]],
["What are optional operations in the Collection interface? Give an example.","Intermediate",["p:Methods such as <code>add</code> and <code>remove</code> are documented as <i>optional</i>: an implementation may throw <code>UnsupportedOperationException</code> if it does not support them, for example fixed-size or unmodifiable views.","c:List&lt;String&gt; l = Arrays.asList(\"a\", \"b\");\nl.set(0, \"x\");   // OK\nl.add(\"c\");       // UnsupportedOperationException (fixed size)"]]]},
{t:"List Interface and Implementations",qs:[
["ArrayList vs LinkedList: when would you choose each?","Intermediate",["l:<b>ArrayList</b> uses a resizable array: <code>get(i)</code> is O(1), append is amortised O(1), insert/remove in the middle is O(n) due to shifting.|<b>LinkedList</b> is a doubly linked list: access by index is O(n), insert/remove is O(1) <i>once you hold the node/iterator</i>.","p:In practice ArrayList is the default choice: it is cache-friendly and uses less memory per element. LinkedList rarely wins, mainly when you do many insertions/removals through an iterator or use it as a Deque (ArrayDeque is usually better still)."]],
["How does ArrayList grow internally?","Advanced",["p:<code>new ArrayList&lt;&gt;()</code> starts with a shared empty array; the backing array of <b>capacity 10</b> is allocated on the first <code>add</code>. When full, it grows to about <b>1.5×</b>:","c:int newCapacity = oldCapacity + (oldCapacity >> 1);\n// elements copied with Arrays.copyOf(...)","p:Growth is amortised O(1) but each resize copies the array. If you know the size, use <code>new ArrayList&lt;&gt;(n)</code> or <code>ensureCapacity(n)</code>. <code>trimToSize()</code> releases unused capacity."]],
["Output-based: what does this code print?","Advanced",["c:List&lt;String&gt; list = new ArrayList&lt;&gt;(List.of(\"a\", \"b\", \"c\"));\nfor (String s : list) {\n    if (s.equals(\"b\")) list.remove(s);\n}\nSystem.out.println(list);","p:It prints <code>[a, c]</code> with <b>no exception</b>. After removing \"b\" the size becomes 2 and the iterator's cursor is 2, so <code>hasNext()</code> (which checks <code>cursor != size</code>) returns false and the loop ends before <code>next()</code> can detect the modification.","p:Remove \"a\" instead and you get <code>ConcurrentModificationException</code>. This is a fail-fast <i>best effort</i>, not a guarantee. Safe options: <code>Iterator.remove()</code> or <code>list.removeIf(...)</code> (Java 8+)."]],
["What is the difference between <code>Arrays.asList()</code> and <code>List.of()</code>?","Intermediate",["l:<code>Arrays.asList(arr)</code> is a <b>fixed-size view backed by the array</b>: <code>set</code> works and writes through to the array, <code>add/remove</code> throw <code>UnsupportedOperationException</code>, nulls are allowed.|<code>List.of(...)</code> (Java 9+) is <b>immutable</b>: any modification throws, and <b>nulls are rejected</b> with <code>NullPointerException</code> (so is <code>contains(null)</code>).","p:For a modifiable copy use <code>new ArrayList&lt;&gt;(List.of(...))</code>."]]]},
{t:"Set Interface and Implementations",qs:[
["Compare HashSet, LinkedHashSet and TreeSet.","Beginner",["l:<b>HashSet</b>: no ordering guarantee, O(1) average add/contains/remove, allows one null.|<b>LinkedHashSet</b>: keeps insertion order (extra linked list), slightly slower and larger than HashSet.|<b>TreeSet</b>: sorted order via a red-black tree, O(log n) operations, no null (with natural ordering), needs <code>Comparable</code> or a <code>Comparator</code>."]],
["How does HashSet ensure uniqueness internally?","Intermediate",["p:A <code>HashSet</code> wraps a <code>HashMap</code>. Each element is stored as a <b>key</b> with a shared dummy object as the value.","c:private static final Object PRESENT = new Object();\npublic boolean add(E e) { return map.put(e, PRESENT) == null; }","p:So <code>add</code> returns <code>false</code> when an equal key (same hash and <code>equals</code>) already exists, and the existing element is kept."]],
["What is the equals/hashCode contract and what breaks if you override only <code>equals</code>?","Intermediate",["l:Equal objects <b>must</b> have equal hash codes.|Hash code must be consistent while the fields used in <code>equals</code> do not change.|Unequal objects may share a hash code (collision).","p:If you override <code>equals</code> only, two logically equal objects usually land in different buckets, so a HashSet/HashMap treats them as distinct and <code>contains</code> may return false. Use <code>Objects.hash(...)</code> or a record (Java 16+), which generates both correctly."]],
["Output-based: what happens when you mutate an element after adding it to a HashSet?","Advanced",["c:Set&lt;List&lt;Integer&gt;&gt; set = new HashSet&lt;&gt;();\nList&lt;Integer&gt; list = new ArrayList&lt;&gt;(List.of(1, 2));\nset.add(list);\nlist.add(3);\nSystem.out.println(set.contains(list));\nSystem.out.println(set.size());","p:Prints <code>false</code> then <code>1</code>. The list was stored in the bucket for its old hash code; after mutation its hash changed, so lookup goes to a different bucket. The element is still in the set but effectively <b>lost</b> (a memory leak risk). Never mutate fields used by <code>hashCode</code> while an object is a key or set member."]]]},
{t:"HashMap Internal Implementation",qs:[
["Explain how HashMap works internally.","Intermediate",["l:Backed by an array of buckets (<code>Node&lt;K,V&gt;[] table</code>).|<code>put(k,v)</code> computes <code>hash(k)</code>, then the index <code>(n - 1) &amp; hash</code>.|Empty bucket: a new node is stored. Occupied: keys are compared by hash then <code>equals</code>; a match replaces the value, otherwise the node is chained (linked list, or tree when large).|When size exceeds the threshold the table is resized and entries redistributed."]],
["What are HashMap's default capacity, load factor and resize behaviour?","Intermediate",["p:Default capacity is <b>16</b> (allocated lazily on first put), load factor <b>0.75</b>, so the threshold is 12. When <code>size &gt; threshold</code> the table <b>doubles</b>, and each node stays at its index or moves by exactly the old capacity.","p:To avoid resizes for n expected entries, use capacity <code>n / 0.75 + 1</code> (Java 19+ has <code>HashMap.newHashMap(n)</code>)."]],
["What is treeification in Java 8 HashMap?","Advanced",["p:When a bucket's chain length reaches <b>8</b> (<code>TREEIFY_THRESHOLD</code>) <i>and</i> the table capacity is at least <b>64</b>, the chain becomes a red-black tree, so worst-case lookup is O(log n) rather than O(n). If capacity is below 64, the map resizes instead. A tree reverts to a list when it shrinks to <b>6</b> nodes.","p:Tree ordering uses <code>Comparable</code> when keys provide it, so comparable keys with bad hash codes degrade more gracefully. This also mitigates hash-collision denial-of-service attacks."]],
["Why does HashMap spread the hash with <code>h ^ (h &gt;&gt;&gt; 16)</code>?","Advanced",["p:Index selection uses only the low bits of the hash (<code>(n-1) &amp; hash</code>). XOR-ing the high 16 bits into the low 16 means high bits also influence the bucket, which reduces collisions for hash codes that differ only in upper bits."]],
["Why is HashMap capacity always a power of two?","Advanced",["p:It makes index computation a cheap bit-mask, <code>(n-1) &amp; hash</code>, instead of a modulo, and it makes resizing simple: each node either stays at index <code>j</code> or moves to <code>j + oldCap</code>. Passing a non-power-of-two capacity to the constructor rounds it up."]],
["How does HashMap treat null keys and values? How do other maps differ?","Beginner",["l:<b>HashMap</b>: one null key (stored at bucket 0, hash 0) and any number of null values.|<b>LinkedHashMap</b>: same as HashMap.|<b>TreeMap</b>: null key throws NPE with natural ordering.|<b>Hashtable</b> and <b>ConcurrentHashMap</b>: null keys and values throw NPE (so <code>get</code> returning null is unambiguous)."]],
["Is HashMap thread-safe? What can go wrong under concurrent use?","Advanced",["p:No. Unsynchronised concurrent writes can cause <b>lost updates</b>, inconsistent size, and stale reads. In Java 7 a concurrent resize could create a cycle in a bucket and spin a CPU at 100% on <code>get</code>; Java 8 removed that specific failure, but the map is still unsafe.","p:Use <code>ConcurrentHashMap</code> for concurrent access, or confine the map to one thread. <code>Collections.synchronizedMap</code> works but locks the whole map and still needs manual locking during iteration."]],
["What makes a good HashMap key?","Intermediate",["p:An <b>immutable</b> class with well-distributed <code>hashCode</code> and a consistent <code>equals</code>. <code>String</code> is ideal: immutable and its hash is cached. Mutable keys can become unreachable after modification (see the HashSet example). Records and enums also make good keys."]],
["Show how <code>getOrDefault</code>, <code>computeIfAbsent</code> and <code>merge</code> simplify common map code.","Intermediate",["c:Map&lt;String, Integer&gt; count = new HashMap&lt;&gt;();\nfor (String w : words) count.merge(w, 1, Integer::sum);   // word count\n\nMap&lt;String, List&lt;String&gt;&gt; groups = new HashMap&lt;&gt;();\ngroups.computeIfAbsent(\"fruit\", k -&gt; new ArrayList&lt;&gt;()).add(\"apple\");\n\nint n = count.getOrDefault(\"java\", 0);","p:Available since Java 8. Do not modify the map inside a <code>computeIfAbsent</code> mapping function: HashMap may throw <code>ConcurrentModificationException</code>."]]]},
{t:"LinkedHashMap and TreeMap",qs:[
["How does LinkedHashMap maintain order, and how do you build an LRU cache with it?","Advanced",["p:It adds a doubly linked list through all entries. Order is <b>insertion order</b> by default, or <b>access order</b> if constructed with <code>accessOrder = true</code>. Override <code>removeEldestEntry</code> to evict.","c:class LRU&lt;K, V&gt; extends LinkedHashMap&lt;K, V&gt; {\n    private final int cap;\n    LRU(int cap) { super(16, 0.75f, true); this.cap = cap; }\n    @Override protected boolean removeEldestEntry(Map.Entry&lt;K, V&gt; e) {\n        return size() &gt; cap;\n    }\n}","p:Not thread-safe; wrap with <code>Collections.synchronizedMap</code> for simple sharing."]],
["How does TreeMap work and what are its constraints?","Intermediate",["p:A <b>red-black tree</b> (self-balancing) giving sorted keys and O(log n) <code>put/get/remove</code>. Keys must be <code>Comparable</code> or a <code>Comparator</code> must be supplied, otherwise a <code>ClassCastException</code> occurs. A null key throws NPE with natural ordering. Not thread-safe; use <code>ConcurrentSkipListMap</code> for a concurrent sorted map."]],
["Output-based: what does this TreeSet print?","Advanced",["c:Set&lt;String&gt; s = new TreeSet&lt;&gt;(Comparator.comparingInt(String::length));\ns.add(\"aa\"); s.add(\"bb\"); s.add(\"ccc\");\nSystem.out.println(s + \" \" + s.size());","p:Prints <code>[aa, ccc] 2</code>. TreeSet/TreeMap decide equality through the comparator (<code>compare == 0</code>), not <code>equals</code>. \"bb\" has the same length as \"aa\", so it is treated as a duplicate and rejected. A comparator should be <b>consistent with equals</b> to avoid such surprises."]],
["Which NavigableMap/NavigableSet methods are commonly used?","Intermediate",["l:<code>floorKey(k)</code> greatest key &le; k; <code>lowerKey(k)</code> strictly less.|<code>ceilingKey(k)</code> least key &ge; k; <code>higherKey(k)</code> strictly greater.|<code>headMap(k)</code>, <code>tailMap(k)</code>, <code>subMap(a,b)</code>: <i>views</i> of ranges.|<code>firstEntry()</code>, <code>pollFirstEntry()</code>, <code>descendingMap()</code>.","p:Each is O(log n); typical uses are range queries and nearest-match lookups, e.g. finding the applicable price tier."]]]},
{t:"Queue and Deque",qs:[
["What are the differences between <code>add/offer</code>, <code>remove/poll</code> and <code>element/peek</code> in Queue?","Beginner",["l:<code>add</code> / <code>remove</code> / <code>element</code> <b>throw an exception</b> on failure (full queue, <code>NoSuchElementException</code> when empty).|<code>offer</code> / <code>poll</code> / <code>peek</code> <b>return a special value</b> (<code>false</code> or <code>null</code>).","p:Prefer <code>offer/poll/peek</code> for bounded queues and normal control flow."]],
["How does PriorityQueue work? What does iterating over it give you?","Intermediate",["p:It is a <b>binary min-heap</b> in an array. <code>offer</code> and <code>poll</code> are O(log n), <code>peek</code> is O(1), and <code>remove(Object)</code> / <code>contains</code> are O(n). Nulls are not allowed, and it is not thread-safe (use <code>PriorityBlockingQueue</code>).","p:Iteration and <code>toString</code> follow the heap array, <b>not sorted order</b>; only <code>poll()</code> repeatedly yields sorted order. For a max-heap use <code>new PriorityQueue&lt;&gt;(Comparator.reverseOrder())</code>. Elements with equal priority have no guaranteed order (not stable)."]],
["ArrayDeque vs LinkedList vs Stack: which should you use as a stack or queue?","Intermediate",["p:Use <b>ArrayDeque</b>. It is a resizable circular array, usually faster and lighter than <code>LinkedList</code>, and it implements <code>Deque</code> with <code>push/pop/peek</code> and <code>offer/poll</code>. It rejects nulls. <code>Stack</code> extends <code>Vector</code> (synchronised, legacy) and is discouraged; the Javadoc recommends Deque instead.","c:Deque&lt;Integer&gt; stack = new ArrayDeque&lt;&gt;();\nstack.push(1); stack.push(2);\nSystem.out.println(stack.pop());   // 2"]],
["Coding: find the K most frequent words efficiently.","Advanced",["p:Count with a HashMap, then keep a <b>min-heap of size k</b>: O(n log k) time, O(n) space.","c:Map&lt;String, Integer&gt; freq = new HashMap&lt;&gt;();\nfor (String w : words) freq.merge(w, 1, Integer::sum);\n\nPriorityQueue&lt;Map.Entry&lt;String, Integer&gt;&gt; pq =\n    new PriorityQueue&lt;&gt;(Map.Entry.comparingByValue());\nfor (Map.Entry&lt;String, Integer&gt; e : freq.entrySet()) {\n    pq.offer(e);\n    if (pq.size() &gt; k) pq.poll();   // drop the least frequent\n}"]]]},
{t:"Iterators and Fail-Fast Behaviour",qs:[
["Compare Iterator, ListIterator and Enumeration.","Beginner",["l:<b>Enumeration</b>: legacy (Vector, Hashtable), read-only: <code>hasMoreElements/nextElement</code>.|<b>Iterator</b>: works on every Collection; adds <code>remove()</code>, plus <code>forEachRemaining</code> (Java 8).|<b>ListIterator</b>: Lists only; bidirectional (<code>hasPrevious/previous</code>), supports <code>add</code>, <code>set</code>, <code>nextIndex</code>, and can start at any index."]],
["What are fail-fast and fail-safe iterators?","Intermediate",["p:<b>Fail-fast</b> iterators (ArrayList, HashMap, HashSet…) compare an internal <code>modCount</code> with the value captured at creation; a structural change by anything other than the iterator itself throws <code>ConcurrentModificationException</code>. It is best-effort, never a guarantee, so do not rely on it for program logic.","p:Concurrent collections do not throw: <code>CopyOnWriteArrayList</code> iterates over a <b>snapshot</b>, while <code>ConcurrentHashMap</code> iterators are <b>weakly consistent</b> (they may or may not reflect later updates). \"Fail-safe\" is common interview wording, not an official Javadoc term."]],
["How do you safely remove elements while iterating?","Intermediate",["c:Iterator&lt;String&gt; it = list.iterator();\nwhile (it.hasNext()) {\n    if (it.next().startsWith(\"x\")) it.remove();\n}\n// Java 8+\nlist.removeIf(s -&gt; s.startsWith(\"x\"));\nmap.entrySet().removeIf(e -&gt; e.getValue() == null);","p:<code>Iterator.remove()</code> updates the iterator's expected modCount, so no exception occurs. <code>removeIf</code> on ArrayList is also efficient: one pass instead of repeated shifting."]],
["Output-based: does updating a HashMap value while iterating throw an exception?","Advanced",["c:Map&lt;String, Integer&gt; m = new HashMap&lt;&gt;(Map.of(\"a\", 1, \"b\", 2));\nfor (String k : m.keySet()) m.put(k, 10);        // (1)\nfor (String k : m.keySet()) m.put(k + \"x\", 1);   // (2)","p:(1) runs fine: replacing the value of an <b>existing</b> key is not a structural modification, so modCount is unchanged. (2) throws <code>ConcurrentModificationException</code> because adding a new key is structural (it would be detected on the next <code>next()</code> call)."]]]},
{t:"Comparable and Comparator",qs:[
["What is the difference between Comparable and Comparator?","Beginner",["l:<code>Comparable&lt;T&gt;</code> (<code>java.lang</code>): one <b>natural ordering</b> defined inside the class by <code>compareTo(T)</code>.|<code>Comparator&lt;T&gt;</code> (<code>java.util</code>): an <b>external</b> ordering via <code>compare(T,T)</code>; you can have many, and can order classes you cannot modify.","p:Since Java 8 Comparator is a functional interface with factory and default methods (<code>comparing</code>, <code>thenComparing</code>, <code>reversed</code>)."]],
["How do you build a multi-field Comparator with Java 8+?","Intermediate",["c:list.sort(Comparator.comparing(Employee::getDept)\n        .thenComparing(Employee::getSalary, Comparator.reverseOrder())\n        .thenComparing(Employee::getName,\n            Comparator.nullsFirst(Comparator.naturalOrder())));","p:Use <code>comparingInt/Long/Double</code> to avoid boxing. Note <code>reversed()</code> applies to the whole chain built so far."]],
["What is wrong with <code>(a, b) -&gt; a - b</code> as a Comparator?","Advanced",["p:Integer subtraction can <b>overflow</b>. For example <code>Integer.MIN_VALUE - 1</code> wraps to a large positive number, saying MIN_VALUE is greater than 1. This gives an inconsistent ordering that can corrupt TreeMaps or make sort throw.","c:Comparator&lt;Integer&gt; ok = Integer::compare;   // or Comparator.naturalOrder()"]],
["Is Collections.sort stable? What does \"Comparison method violates its general contract\" mean?","Advanced",["p:Object sorting (<code>List.sort</code>, <code>Collections.sort</code>, <code>Arrays.sort(T[])</code>) uses <b>TimSort</b>, a stable merge-based sort: equal elements keep their relative order, and it is O(n log n) worst case with O(n) auxiliary space (near O(n) on nearly sorted data). Primitive arrays use dual-pivot quicksort, where stability is irrelevant.","p:The <code>IllegalArgumentException</code> is thrown when a comparator breaks its contract (not symmetric, not transitive, e.g. the overflow case above). It is detected only on some inputs."]],
["Output-based: HashSet vs TreeSet with BigDecimal.","Advanced",["c:BigDecimal a = new BigDecimal(\"1.0\"), b = new BigDecimal(\"1.00\");\nSystem.out.println(new HashSet&lt;&gt;(List.of(a, b)).size());\nSystem.out.println(new TreeSet&lt;&gt;(List.of(a, b)).size());","p:Prints <code>2</code> then <code>1</code>. <code>BigDecimal.equals</code> compares value <b>and scale</b> (1.0 != 1.00), but <code>compareTo</code> ignores scale. HashSet uses equals/hashCode; TreeSet uses compareTo. This is the classic example of a Comparable that is inconsistent with equals."]]]},
{t:"Collections Utility Class",qs:[
["List the most useful methods of the Collections class.","Beginner",["l:Ordering: <code>sort</code>, <code>reverse</code>, <code>shuffle</code>, <code>rotate</code>, <code>swap</code>|Searching: <code>binarySearch</code>, <code>min</code>, <code>max</code>, <code>frequency</code>, <code>disjoint</code>|Wrappers: <code>unmodifiableXxx</code>, <code>synchronizedXxx</code>, <code>checkedXxx</code>|Factories: <code>emptyList</code>, <code>singletonList</code>, <code>nCopies</code>"]],
["How does <code>Collections.binarySearch</code> behave?","Intermediate",["p:The list must already be sorted with the same ordering, otherwise results are undefined. It returns the index if found, or <code>-(insertionPoint) - 1</code> if not, so a negative result tells you where to insert. It is O(log n) for RandomAccess lists (ArrayList) but O(n) traversal for LinkedList."]],
["Is <code>Collections.unmodifiableList</code> the same as an immutable list?","Intermediate",["c:List&lt;String&gt; src = new ArrayList&lt;&gt;(List.of(\"a\"));\nList&lt;String&gt; view = Collections.unmodifiableList(src);\nList&lt;String&gt; copy = List.copyOf(src);   // Java 10+\nsrc.add(\"b\");\nSystem.out.println(view + \" \" + copy);","p:Prints <code>[a, b] [a]</code>. <code>unmodifiableList</code> is a read-only <b>view</b>: it blocks writes through the wrapper but reflects changes to the underlying list. <code>List.of</code>/<code>List.copyOf</code> create truly immutable lists (element objects themselves can still be mutable)."]],
["<code>Collections.synchronizedList</code> vs <code>CopyOnWriteArrayList</code>: when to use which?","Advanced",["l:<b>synchronizedList</b>: every method locks one mutex; iteration still needs manual <code>synchronized(list)</code>, otherwise races/CME.|<b>CopyOnWriteArrayList</b>: each write copies the array (O(n)); reads and iteration are lock-free on a snapshot and never throw CME. Best for read-mostly data like listener lists, poor for frequent writes or large lists.","p:Its snapshot iterators do not support <code>remove()</code>."]]]},
{t:"Concurrent Collections",qs:[
["How is ConcurrentHashMap implemented in Java 8+?","Advanced",["p:Java 7 used segment locks. Java 8 removed segments: an empty bin is filled with a <b>CAS</b>, otherwise updates <b>synchronize on the first node of that bin</b>, so contention is per bin. Large bins also treeify. <code>get</code> is lock-free (volatile reads). The size is tracked with striped counters (like <code>LongAdder</code>), so <code>size()</code> is an estimate under concurrent updates; prefer <code>mappingCount()</code> for large maps.","p:Null keys and values are rejected, and iterators are weakly consistent."]],
["Why is <code>if (!map.containsKey(k)) map.put(k, v)</code> unsafe on a ConcurrentHashMap?","Advanced",["p:Each call is atomic but the <b>check-then-act sequence is not</b>: two threads can both see the key missing and both put. Use the atomic compound operations:","c:map.putIfAbsent(k, v);\nmap.computeIfAbsent(k, key -&gt; expensiveCreate(key));\nmap.merge(word, 1L, Long::sum);\nmap.compute(k, (key, old) -&gt; old == null ? 1 : old + 1);","p:Keep mapping functions short and do not modify the map from inside them (it can deadlock or throw)."]],
["Compare Hashtable, <code>Collections.synchronizedMap</code> and ConcurrentHashMap.","Intermediate",["l:<b>Hashtable</b>: legacy, all methods synchronized, no nulls, enumerator-based, effectively superseded.|<b>synchronizedMap</b>: wraps any Map with one lock; allows nulls if the wrapped map does; iteration must be locked manually.|<b>ConcurrentHashMap</b>: fine-grained locking and lock-free reads, much higher throughput, atomic compound methods, no nulls."]],
["Which BlockingQueue implementations exist and how do you build a producer-consumer with one?","Advanced",["l:<b>ArrayBlockingQueue</b>: bounded, array-based, single lock, optional fairness.|<b>LinkedBlockingQueue</b>: optionally bounded (default <code>Integer.MAX_VALUE</code>), separate put/take locks.|<b>PriorityBlockingQueue</b>: unbounded, heap-ordered. <b>SynchronousQueue</b>: no capacity, direct hand-off. <b>DelayQueue</b>: elements available after a delay.","c:BlockingQueue&lt;Task&gt; q = new ArrayBlockingQueue&lt;&gt;(100);\n// producer:  q.put(task);      // blocks when full\n// consumer:  Task t = q.take(); // blocks when empty","p:A bounded queue gives natural <b>back-pressure</b>; an unbounded one can cause <code>OutOfMemoryError</code> if producers outpace consumers."]],
["When would you choose ConcurrentSkipListMap over a synchronized TreeMap?","Advanced",["p:<code>ConcurrentSkipListMap</code> is a lock-free, sorted, navigable map based on skip lists: O(log n) expected operations, and concurrent readers and writers without a global lock, with weakly consistent iterators. Pick it when you need <b>sorted order with high concurrency</b>; a synchronized TreeMap serialises all access. If order is not needed, ConcurrentHashMap is faster."]]]},
{t:"ArrayList and LinkedList Internals",qs:[
["Output-based: what is the difference between <code>remove(int)</code> and <code>remove(Object)</code> on a <code>List&lt;Integer&gt;</code>?","Intermediate",["c:List&lt;Integer&gt; list = new ArrayList&lt;&gt;(List.of(10, 20, 30));\nlist.remove(1);                    // (1)\nlist.remove(Integer.valueOf(10));  // (2)\nSystem.out.println(list);","p:Prints <code>[30]</code>. (1) picks <code>remove(int index)</code> and removes the element at index 1 (20). (2) picks <code>remove(Object)</code> and removes the first element equal to 10. Overload resolution prefers the exact primitive match, which makes <code>remove(1)</code> a common bug."]],
["What does <code>subList</code> return and what are its pitfalls?","Advanced",["p:A <b>view</b> of the range [from, to) backed by the original list: changes on either side show through. If the parent list is <i>structurally</i> modified after the view is created, using the view throws <code>ConcurrentModificationException</code>. A long-lived subList also keeps the whole parent list in memory.","c:list.subList(0, 3).clear();                   // removes first 3 from list\nList&lt;Integer&gt; safe = new ArrayList&lt;&gt;(list.subList(0, 3));  // independent copy"]],
["How is LinkedList implemented, and how does <code>get(i)</code> behave?","Intermediate",["p:A <b>doubly linked list</b> of <code>Node{item, next, prev}</code> with <code>first</code> and <code>last</code> references; it implements both <code>List</code> and <code>Deque</code>. <code>get(i)</code> walks from the nearer end (head if <code>i &lt; size/2</code>, else tail), so it is O(n). Each element costs an extra node object (about 24 bytes of overhead on a typical 64-bit JVM with compressed oops), and traversal is cache-unfriendly, which is why ArrayList usually beats it even for middle inserts on moderate sizes."]],
["What is the <code>RandomAccess</code> marker interface for?","Advanced",["p:ArrayList and Vector implement this empty interface to signal that indexed access is fast. Algorithms such as <code>Collections.binarySearch</code> and <code>Collections.shuffle</code> check <code>instanceof RandomAccess</code> to choose between index-based and iterator-based strategies. Your own code should do the same before looping with <code>get(i)</code> over an arbitrary List."]]]},
{t:"Vector and Stack",qs:[
["How does Vector differ from ArrayList?","Beginner",["l:Vector is <b>synchronized</b> per method (ArrayList is not), so it is slower and per-call locking does not make compound operations or iteration safe.|With the default constructor Vector <b>doubles</b> its capacity (ArrayList grows by 1.5x).|Vector exposes legacy methods (<code>elements()</code>, <code>addElement</code>) and is retained for compatibility; use ArrayList, or <code>CopyOnWriteArrayList</code> / <code>synchronizedList</code> when you need thread safety."]],
["Why is <code>Stack</code> discouraged, and what replaces it?","Intermediate",["p:<code>Stack</code> extends <code>Vector</code>, so it inherits synchronisation overhead and exposes non-stack operations (<code>get(i)</code>, <code>add(i, e)</code>), breaking the LIFO abstraction. <code>pop()</code> and <code>peek()</code> on an empty Stack throw <code>EmptyStackException</code>. Use <code>Deque&lt;T&gt; stack = new ArrayDeque&lt;&gt;()</code> (<code>push/pop/peek</code>); for a thread-safe stack consider <code>ConcurrentLinkedDeque</code> or a <code>LinkedBlockingDeque</code>."]]]},
{t:"Generics and Type Safety",qs:[
["What is type erasure and why can't you create a generic array?","Advanced",["p:Generics are a compile-time feature: the compiler checks types, inserts casts and <b>erases</b> type parameters to their bounds (<code>Object</code> if unbounded). At runtime <code>List&lt;String&gt;</code> and <code>List&lt;Integer&gt;</code> are both <code>List</code>. Arrays are reified and covariant, so a generic array could not be checked safely at runtime.","c:List&lt;String&gt;[] a = new List&lt;String&gt;[10];       // compile error\nList&lt;List&lt;String&gt;&gt; ok = new ArrayList&lt;&gt;();         // preferred","p:Consequences: no <code>new T()</code>, no <code>instanceof List&lt;String&gt;</code>, and overloads that differ only by type argument clash."]],
["Explain PECS (Producer Extends, Consumer Super) with an example.","Advanced",["c:static &lt;T&gt; void copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src) {\n    for (T t : src) dest.add(t);   // src produces, dest consumes\n}","p:A <code>List&lt;? extends Number&gt;</code> can be read as <code>Number</code> but you cannot add to it (except null), because the real element type is unknown. A <code>List&lt;? super Integer&gt;</code> accepts Integers, but reads only give <code>Object</code>. This is why <code>Collections.copy</code> and <code>Comparator&lt;? super T&gt;</code> are declared this way."]],
["Is <code>List&lt;Object&gt;</code> a supertype of <code>List&lt;String&gt;</code>? How does <code>List&lt;?&gt;</code> differ?","Intermediate",["p:No. Generics are <b>invariant</b>: <code>List&lt;String&gt;</code> is not a <code>List&lt;Object&gt;</code>, otherwise you could add an Integer through the Object view. Use <code>List&lt;?&gt;</code> (unbounded wildcard) for read-only code that does not care about the element type: you can read <code>Object</code>s and call <code>size()</code>, but you cannot add anything except null."]],
["What are raw types and heap pollution?","Advanced",["p:A raw type (<code>List</code> without type arguments) turns off generic checks. Adding the wrong type through a raw reference compiles with only an unchecked warning, and the failure appears later as a <code>ClassCastException</code> at an unrelated line.","c:List&lt;String&gt; names = new ArrayList&lt;&gt;();\nList raw = names;\nraw.add(42);                 // unchecked warning only\nString s = names.get(0);     // ClassCastException here","p:Avoid raw types; if you must bridge legacy code use <code>Collections.checkedList</code> to fail at the point of insertion."]]]},
{t:"Streams and Collections Integration",qs:[
["Why does <code>Collectors.toMap</code> throw, and how do you fix it?","Intermediate",["p:With duplicate keys it throws <code>IllegalStateException</code> (\"Duplicate key\"), and it throws <code>NullPointerException</code> when a value is null. Provide a merge function (and a map supplier if you need a specific map type).","c:Map&lt;Integer, String&gt; m = people.stream().collect(\n    Collectors.toMap(Person::id, Person::name, (a, b) -&gt; a, LinkedHashMap::new));"]],
["How do you group and count with streams?","Intermediate",["c:Map&lt;String, Long&gt; byDept = emps.stream()\n    .collect(Collectors.groupingBy(Employee::getDept, TreeMap::new, Collectors.counting()));","p:<code>groupingBy</code> returns a <code>HashMap</code> by default; the three-argument form chooses the map type and the downstream collector (<code>counting</code>, <code>summingInt</code>, <code>mapping</code>, <code>averagingDouble</code>…). <code>partitioningBy</code> splits into true/false groups."]],
["<code>Stream.toList()</code> vs <code>Collectors.toList()</code>: what are the differences?","Advanced",["l:<code>Collectors.toList()</code>: returns a modifiable list in practice (an ArrayList), but the type is <b>not guaranteed</b>.|<code>Stream.toList()</code> (Java 16+): returns an <b>unmodifiable</b> list; nulls are allowed.|<code>Collectors.toUnmodifiableList()</code> (Java 10+): unmodifiable and <b>rejects nulls</b>."]],
["What is wrong with filling an ArrayList from a parallel stream using <code>forEach</code>?","Advanced",["c:List&lt;Integer&gt; out = new ArrayList&lt;&gt;();\nIntStream.range(0, 1000).parallel().forEach(out::add);   // data race\n\nList&lt;Integer&gt; ok = IntStream.range(0, 1000).parallel().boxed().toList();","p:ArrayList is not thread-safe, so the result can lose elements, contain nulls or throw <code>ArrayIndexOutOfBoundsException</code>. Let the stream do the accumulation with <code>collect</code>/<code>toList</code>, which merges per-thread containers safely, and avoid shared mutable state in lambdas."]]]},
{t:"Immutable Collections, Complexity and Java Versions",qs:[
["What are the rules of <code>List.of</code>, <code>Set.of</code> and <code>Map.of</code>?","Intermediate",["l:Truly immutable; modification throws <code>UnsupportedOperationException</code>.|Nulls are rejected (NPE); <code>Set.of</code> and <code>Map.of</code> throw <code>IllegalArgumentException</code> on duplicate elements/keys.|Iteration order of <code>Set.of</code> and <code>Map.of</code> is <b>unspecified and can vary between JVM runs</b>; never depend on it.|<code>Map.ofEntries</code> handles more than 10 pairs; <code>copyOf</code> (Java 10+) makes immutable copies, returning the same instance if the source is already immutable."]],
["What are Sequenced Collections (Java 21)?","Advanced",["p:Java 21 added <code>SequencedCollection</code>, <code>SequencedSet</code> and <code>SequencedMap</code> for collections with a defined encounter order. They add <code>getFirst()</code>, <code>getLast()</code>, <code>addFirst/addLast</code>, <code>removeFirst/removeLast</code> and <code>reversed()</code> (a view). They apply to <code>List</code>, <code>Deque</code>, <code>LinkedHashSet</code>, <code>SortedSet/NavigableSet</code>, and for maps <code>LinkedHashMap</code> and <code>SortedMap</code> (with <code>firstEntry</code>, <code>lastEntry</code>, <code>putFirst</code>, <code>reversed</code>).","c:var list = new ArrayList&lt;&gt;(List.of(1, 2, 3));\nlist.getLast();            // 3   (Java 21+)\nlist.reversed();           // [3, 2, 1] view\n// Java 8: list.get(list.size() - 1)"]],
["Summarise the main collection-related changes from Java 8 to 25.","Advanced",["l:<b>Java 8</b>: default methods on interfaces, streams, <code>removeIf</code>, <code>Map.merge/compute</code>, HashMap treeification, <code>Comparator</code> factories.|<b>Java 9</b>: <code>List.of/Set.of/Map.of</code>.|<b>Java 10</b>: <code>copyOf</code>, <code>toUnmodifiableXxx</code> collectors.|<b>Java 16</b>: <code>Stream.toList()</code>, records (good keys).|<b>Java 19</b>: <code>HashMap.newHashMap(n)</code> style factories.|<b>Java 21</b>: Sequenced Collections.","p:Always check the Javadoc <code>@since</code> tag before using an API in code that must run on Java 8."]],
["Give a time-complexity cheat sheet for the common collections.","Intermediate",["l:<b>ArrayList</b>: get/set O(1), add at end amortised O(1), insert/remove in middle O(n), contains O(n).|<b>LinkedList</b>: get(i) O(n), add/remove at either end O(1).|<b>HashMap/HashSet</b>: average O(1), worst O(log n) with treeified bins (Java 8+).|<b>TreeMap/TreeSet</b>: O(log n).|<b>PriorityQueue</b>: offer/poll O(log n), peek O(1), remove(Object) O(n).|<b>ArrayDeque</b>: O(1) at both ends.","p:Big-O ignores constants, memory layout and boxing, so measure (JMH) before optimising."]]]},
{t:"Sorting, Searching and Algorithms",qs:[
["Which sorting algorithms do <code>Arrays.sort</code> and <code>Collections.sort</code> use?","Intermediate",["l:Primitive arrays: <b>dual-pivot quicksort</b> (average O(n log n), not stable, which does not matter for primitives).|Object arrays and Lists: <b>TimSort</b> (stable, O(n log n) worst case, fast on partly sorted data). <code>List.sort</code> copies to an array, sorts, then writes back.|<code>Arrays.parallelSort</code> (Java 8) splits large arrays over the ForkJoin pool."]],
["How do you sort a Map by value?","Intermediate",["c:Map&lt;String, Integer&gt; sorted = map.entrySet().stream()\n    .sorted(Map.Entry.&lt;String, Integer&gt;comparingByValue().reversed())\n    .collect(Collectors.toMap(Map.Entry::getKey, Map.Entry::getValue,\n             (a, b) -&gt; a, LinkedHashMap::new));","p:A TreeMap sorts by key only. The result must be a <code>LinkedHashMap</code> to keep the sorted order."]],
["How do you find and remove duplicates in a List?","Beginner",["c:Set&lt;String&gt; seen = new HashSet&lt;&gt;();\nSet&lt;String&gt; dups = new HashSet&lt;&gt;();\nfor (String s : list) if (!seen.add(s)) dups.add(s);   // add() returns false on duplicate\n\nList&lt;String&gt; unique = new ArrayList&lt;&gt;(new LinkedHashSet&lt;&gt;(list));  // keeps order\nList&lt;String&gt; u2 = list.stream().distinct().toList();"]],
["What do <code>addAll</code>, <code>retainAll</code> and <code>removeAll</code> do, and what is their performance trap?","Intermediate",["p:They implement union, intersection and difference (modifying the receiver). <code>retainAll</code> and <code>removeAll</code> call <code>contains</code> on the argument for every element, so passing a <code>List</code> gives O(n*m). Pass a <code>HashSet</code> to make it O(n).","c:list.removeAll(new HashSet&lt;&gt;(other));"]]]},
{t:"Performance and Memory Optimization",qs:[
["How much memory does a HashMap entry use and how can you reduce it?","Advanced",["p:Each entry is a <code>Node</code> object (header, hash, key, value, next: roughly 32 bytes with compressed oops) plus the boxed key and value objects and a table slot. A <code>HashMap&lt;Integer,Integer&gt;</code> with millions of entries is therefore several times larger than two int arrays.","l:Use primitive-specialised maps (Eclipse Collections, fastutil) for hot paths.|Presize to avoid resize garbage.|Prefer <code>EnumMap</code> for enum keys and avoid storing redundant objects."]],
["What are EnumMap and EnumSet and why are they fast?","Intermediate",["p:<code>EnumMap</code> stores values in an array indexed by the enum's ordinal; <code>EnumSet</code> is a bit vector (a single <code>long</code> for up to 64 constants). No hashing, no per-entry nodes, iteration in declaration order, and null keys are rejected. They are the default choice for enum keys."]],
["What are IdentityHashMap and WeakHashMap?","Advanced",["l:<b>IdentityHashMap</b> compares keys with <code>==</code> (and <code>System.identityHashCode</code>) instead of <code>equals</code>; used for graph traversal and serialization.|<b>WeakHashMap</b> holds keys through weak references, so an entry disappears after its key is garbage-collected. If the value strongly references its key, the entry is never freed. It suits caches keyed by object identity, but not value-based keys like Strings or Integers."]],
["How can a collection cause a memory leak?","Advanced",["p:Collections keep strong references. Common leaks: a <b>static</b> Map/List used as a cache with no eviction, listeners never removed, a queue that grows because consumers are slower than producers, and mutated keys left in a HashMap. Fix with bounded caches (LRU, Caffeine, expiry), <code>WeakReference</code>/<code>WeakHashMap</code> where appropriate, bounded BlockingQueues and explicit removal. Diagnose with a heap dump (Eclipse MAT) by looking for the largest retained collections."]],
["Why is calling <code>list.contains</code> in a loop a performance problem?","Intermediate",["p:<code>ArrayList.contains</code> is O(n), so a loop over n items becomes O(n&sup2;): 100,000 items means about 10 billion comparisons. Build a <code>HashSet</code> once (O(n)) and look up in O(1).","c:Set&lt;String&gt; allowed = new HashSet&lt;&gt;(allowedList);\nfor (String s : input) if (allowed.contains(s)) { /* ... */ }"]]]},
{t:"Custom Collections and Defensive Design",qs:[
["How do you write a correct custom class to use as a HashMap key?","Intermediate",["c:record Point(int x, int y) {}          // Java 16+: equals/hashCode generated\n\nfinal class Key {                         // Java 8 style\n    private final String id; private final int ver;\n    Key(String id, int ver) { this.id = id; this.ver = ver; }\n    @Override public boolean equals(Object o) {\n        if (this == o) return true;\n        if (!(o instanceof Key)) return false;\n        Key k = (Key) o;\n        return ver == k.ver &amp;&amp; id.equals(k.id);\n    }\n    @Override public int hashCode() { return Objects.hash(id, ver); }\n}","p:Make fields final, use the same fields in both methods, and take an <code>Object</code> parameter in <code>equals</code>."]],
["How do you make your own class usable in a for-each loop?","Beginner",["c:class Range implements Iterable&lt;Integer&gt; {\n    private final int lo, hi;\n    Range(int lo, int hi) { this.lo = lo; this.hi = hi; }\n    public Iterator&lt;Integer&gt; iterator() {\n        return new Iterator&lt;&gt;() {\n            int cur = lo;\n            public boolean hasNext() { return cur &lt; hi; }\n            public Integer next() {\n                if (!hasNext()) throw new NoSuchElementException();\n                return cur++;\n            }\n        };\n    }\n}","p:To build a full collection, extend <code>AbstractList</code>/<code>AbstractSet</code> and implement the few abstract methods."]],
["How would you build a thread-safe LRU cache?","Expert",["p:Simplest: a <code>LinkedHashMap</code> with <code>accessOrder=true</code> and <code>removeEldestEntry</code>, wrapped with <code>Collections.synchronizedMap</code> (note that <code>get</code> mutates order, so even reads need the lock). This serialises access; for high concurrency use a purpose-built library such as <b>Caffeine</b> (Window TinyLFU, concurrent, supports expiry and statistics) rather than writing your own."]],
["What are defensive copies and why do collections need them?","Intermediate",["c:class Order {\n    private final List&lt;Item&gt; items;\n    Order(List&lt;Item&gt; in) { this.items = List.copyOf(in); }       // copy in\n    List&lt;Item&gt; getItems() { return items; }                      // already immutable\n    // Java 8: Collections.unmodifiableList(new ArrayList&lt;&gt;(in))\n}","p:Otherwise the caller keeps a reference to your internal list and can change your object's state, or a returned mutable list leaks internals. Copy on the way in, expose unmodifiable views or copies on the way out."]],
["How do you choose the right collection for a requirement?","Intermediate",["l:Ordered with index access: <b>ArrayList</b>. Frequent add/remove at both ends: <b>ArrayDeque</b>.|Unique items, no order: <b>HashSet</b>; keep insertion order: <b>LinkedHashSet</b>; sorted: <b>TreeSet</b>.|Key lookup: <b>HashMap</b>; ordered iteration: <b>LinkedHashMap</b>; sorted/range: <b>TreeMap</b>; enum keys: <b>EnumMap</b>.|Priority processing: <b>PriorityQueue</b>. Concurrent: <b>ConcurrentHashMap</b>, <b>CopyOnWriteArrayList</b>, <b>BlockingQueue</b>."]]]},
{t:"Real-World Scenarios and Troubleshooting",qs:[
["A single-threaded service throws ConcurrentModificationException. How do you debug it?","Advanced",["p:CME does not require multiple threads. Look at the stack trace for <code>next()</code> on a HashMap/ArrayList iterator, then find code that modifies the same collection inside the loop: a for-each calling <code>list.remove</code>, a callback or listener that adds to the list being iterated, or a stream's <code>forEach</code> modifying its own source. Fixes: <code>Iterator.remove()</code>, <code>removeIf</code>, iterate over a copy, or collect changes and apply them after the loop."]],
["A production service shows 100% CPU in <code>HashMap</code> methods. What do you check?","Expert",["p:Take several <b>thread dumps</b> (<code>jstack</code>) and look for RUNNABLE threads stuck in <code>HashMap.get/put/transfer</code>. That points to an unsynchronised HashMap shared across threads (the classic Java 7 resize cycle; in Java 8+ you more often see corruption or lost data). Fix by switching to ConcurrentHashMap or confining the map, and review any static map shared across request threads. Also rule out a degenerate <code>hashCode</code> (next question)."]],
["A service gets slow lookups after you added <code>hashCode()</code> returning a constant. Why?","Advanced",["p:All keys land in one bucket, so lookups degrade to scanning a chain: O(n). Java 8 treeifies the bucket (when capacity is at least 64), giving O(log n) only if keys are <code>Comparable</code>; otherwise the tree must search both subtrees and approaches O(n) again. Use all significant fields via <code>Objects.hash</code> or a record, and also watch for attacker-controlled keys with deliberately colliding hashes."]],
["Output-based: why does this HashSet contain duplicates?","Advanced",["c:class P {\n    String n; P(String n) { this.n = n; }\n    public boolean equals(P o) { return n.equals(o.n); }   // overload, not override\n    public int hashCode() { return n.hashCode(); }\n}\nSet&lt;P&gt; s = new HashSet&lt;&gt;();\ns.add(new P(\"a\")); s.add(new P(\"a\"));\nSystem.out.println(s.size());","p:Prints <code>2</code>. <code>equals(P)</code> <b>overloads</b> rather than overrides <code>equals(Object)</code>, and HashSet calls the <code>Object</code> version (identity). Always add <code>@Override</code> so the compiler catches this."]],
["Output-based: what does <code>Arrays.asList(int[])</code> return?","Advanced",["c:int[] a = {1, 2, 3};\nSystem.out.println(Arrays.asList(a).size());\nInteger[] b = {1, 2, 3};\nSystem.out.println(Arrays.asList(b).size());","p:Prints <code>1</code> then <code>3</code>. Generics cannot use primitives, so for <code>int[]</code> T is inferred as <code>int[]</code> and you get a one-element <code>List&lt;int[]&gt;</code>. Use <code>Integer[]</code> or <code>Arrays.stream(a).boxed().toList()</code>."]],
["An OutOfMemoryError appears with a huge queue in the heap dump. What is the cause and fix?","Expert",["p:Typically an <b>unbounded</b> queue (<code>LinkedBlockingQueue</code> default capacity, or an executor's unbounded work queue) fed faster than it is drained. Fix: use a bounded queue with a rejection or back-pressure policy (e.g. <code>ThreadPoolExecutor</code> with <code>CallerRunsPolicy</code>), add rate limiting, scale consumers, and monitor queue depth as a metric so it is alerted before memory runs out."]]]},
{t:"Maps in Depth: HashMap and ConcurrentHashMap",qs:[
["What is a hash collision and how do different maps resolve it?","Intermediate",["p:A collision happens when two different keys map to the same bucket. <b>HashMap</b> uses <b>separate chaining</b> (linked list, converted to a red-black tree when long). <b>IdentityHashMap</b> uses open addressing with <b>linear probing</b> in a flat array. Collisions are unavoidable (pigeonhole principle); good hash functions just keep chains short."]],
["What happens when you <code>put</code> a key that already exists?","Beginner",["p:The old value is replaced and <code>put</code> returns it (or <code>null</code> if there was no mapping, which is ambiguous with a null value). The <b>original key object is kept</b>, not the new one. In a <code>LinkedHashMap</code> insertion order is unchanged, but with <code>accessOrder=true</code> the entry moves to the end."]],
["How does HashMap redistribute entries when it resizes?","Advanced",["p:The table doubles, and for each bucket the nodes are split into two lists by testing <code>(hash &amp; oldCap) == 0</code>: those stay at index <code>j</code>, the others go to <code>j + oldCap</code>. Relative order inside each list is preserved, and no hashes are recomputed (the hash is cached in each node). Resizing is O(n), so presize when the size is known."]],
["Are <code>keySet()</code>, <code>values()</code> and <code>entrySet()</code> copies?","Intermediate",["p:No, they are <b>live views</b>. Removing through a view (<code>keySet().remove(k)</code>, <code>values().remove(v)</code>, <code>entrySet().removeIf(...)</code>, or <code>Iterator.remove()</code>) removes the mapping from the map, and map changes show up in the view. They do not support <code>add</code> (UnsupportedOperationException). Copy with <code>new ArrayList&lt;&gt;(map.values())</code> for a snapshot."]],
["How do <code>Map.Entry</code> implementations differ?","Advanced",["l:Entries from a HashMap's <code>entrySet()</code> are the map's own nodes: <code>setValue</code> writes through, but the entry should not be used after the mapping is removed.|<code>AbstractMap.SimpleEntry</code> is mutable; <code>SimpleImmutableEntry</code> and <code>Map.entry(k, v)</code> (Java 9+) are immutable, and <code>Map.entry</code> rejects nulls.|By contract an entry's hash code is <code>keyHash ^ valueHash</code>."]],
["How do you get a concurrent Set?","Intermediate",["c:Set&lt;String&gt; s1 = ConcurrentHashMap.newKeySet();            // Java 8+, hash-based\nSet&lt;String&gt; s2 = new ConcurrentSkipListSet&lt;&gt;();            // sorted\nSet&lt;String&gt; s3 = new CopyOnWriteArraySet&lt;&gt;();              // tiny, read-mostly\nSet&lt;String&gt; s4 = Collections.newSetFromMap(new ConcurrentHashMap&lt;&gt;());"]],
["Why is recursive <code>computeIfAbsent</code> dangerous?","Expert",["c:Map&lt;Integer, Long&gt; memo = new ConcurrentHashMap&lt;&gt;();\nlong fib(int n) {\n    if (n &lt; 2) return n;\n    return memo.computeIfAbsent(n, k -&gt; fib(k - 1) + fib(k - 2));   // recursive update\n}","p:The mapping function must not modify the same map. ConcurrentHashMap may block or livelock (Java 8) or throw <code>IllegalStateException: Recursive update</code> (Java 9+); HashMap may throw <code>ConcurrentModificationException</code>. Memoise with an explicit get/put, or a plain loop."]]]},
{t:"Queues, Deques and Heaps in Depth",qs:[
["How is ArrayDeque implemented and why does it reject nulls?","Advanced",["p:A circular array with <code>head</code> and <code>tail</code> indexes; capacity is a power of two so wrapping is a bit-mask, and the array doubles when full. Add/remove at both ends is amortised O(1). Null is rejected because <code>poll()</code>/<code>peek()</code> return <code>null</code> to signal \"empty\", so null elements would be ambiguous."]],
["How does PriorityQueue maintain the heap, and what is the cost of building one from a collection?","Advanced",["p:The heap lives in an array: for index <code>i</code>, parent is <code>(i-1)/2</code>, children are <code>2i+1</code> and <code>2i+2</code>. <code>offer</code> appends and <b>sifts up</b>; <code>poll</code> moves the last element to the root and <b>sifts down</b>, both O(log n). Constructing from a collection (or <code>PriorityQueue(Collection)</code>) uses <b>heapify</b>, O(n), cheaper than n separate offers (O(n log n))."]],
["Coding: implement a queue using two stacks.","Intermediate",["c:class MyQueue&lt;T&gt; {\n    private final Deque&lt;T&gt; in = new ArrayDeque&lt;&gt;(), out = new ArrayDeque&lt;&gt;();\n    void offer(T t) { in.push(t); }\n    T poll() {\n        if (out.isEmpty()) while (!in.isEmpty()) out.push(in.pop());\n        return out.isEmpty() ? null : out.pop();\n    }\n}","p:Each element moves at most once between stacks, so operations are <b>amortised O(1)</b>."]],
["Coding: sliding window maximum with a Deque.","Expert",["c:int[] res = new int[a.length - k + 1];\nDeque&lt;Integer&gt; dq = new ArrayDeque&lt;&gt;();            // indexes, values decreasing\nfor (int i = 0; i &lt; a.length; i++) {\n    while (!dq.isEmpty() &amp;&amp; dq.peekFirst() &lt;= i - k) dq.pollFirst();\n    while (!dq.isEmpty() &amp;&amp; a[dq.peekLast()] &lt; a[i]) dq.pollLast();\n    dq.offerLast(i);\n    if (i &gt;= k - 1) res[i - k + 1] = a[dq.peekFirst()];\n}","p:O(n) time because each index is added and removed at most once; the front of the deque is always the current window's maximum."]],
["Coding: maintain a running median with two heaps.","Expert",["c:PriorityQueue&lt;Integer&gt; lo = new PriorityQueue&lt;&gt;(Comparator.reverseOrder()); // lower half\nPriorityQueue&lt;Integer&gt; hi = new PriorityQueue&lt;&gt;();                         // upper half\nvoid add(int x) {\n    lo.offer(x); hi.offer(lo.poll());\n    if (hi.size() &gt; lo.size()) lo.offer(hi.poll());\n}\ndouble median() {\n    return lo.size() &gt; hi.size() ? lo.peek() : (lo.peek() + hi.peek()) / 2.0;\n}","p:<code>add</code> is O(log n), <code>median</code> is O(1)."]]]},
{t:"Advanced Coding and Output-Based Questions",qs:[
["Output-based: what do the <code>==</code> comparisons print for boxed values in a List?","Advanced",["c:List&lt;Integer&gt; l = List.of(127, 127, 1000, 1000);\nSystem.out.println(l.get(0) == l.get(1));\nSystem.out.println(l.get(2) == l.get(3));","p:Prints <code>true</code> then <code>false</code>. <code>Integer.valueOf</code> caches -128..127 (by default), so the 127s are the same object while each 1000 is a separate object. Always compare boxed values with <code>equals</code>."]],
["Output-based: TreeMap with a case-insensitive comparator.","Advanced",["c:Map&lt;String, Integer&gt; m = new TreeMap&lt;&gt;(String.CASE_INSENSITIVE_ORDER);\nm.put(\"a\", 1); m.put(\"A\", 2);\nSystem.out.println(m);","p:Prints <code>{a=2}</code>. The comparator says \"a\" and \"A\" are equal, so the second put replaces the <b>value</b> but the first key object (\"a\") is retained."]],
["Output-based: removing elements by index in a forward loop.","Intermediate",["c:List&lt;Integer&gt; l = new ArrayList&lt;&gt;(List.of(1, 2, 2, 3));\nfor (int i = 0; i &lt; l.size(); i++) if (l.get(i) == 2) l.remove(i);\nSystem.out.println(l);","p:Prints <code>[1, 2, 3]</code>. After removing the first 2 at index 1, the next element shifts into index 1, but <code>i</code> advances to 2, so the second 2 is skipped. Iterate backwards, use <code>removeIf</code>, or use an Iterator."]],
["Which collections are equal to each other, and how is <code>equals</code> defined?","Advanced",["l:Any two <b>Lists</b> are equal if they have the same elements in the same order, regardless of implementation: <code>new ArrayList&lt;&gt;(List.of(1,2)).equals(new LinkedList&lt;&gt;(List.of(1,2)))</code> is true.|Any two <b>Sets</b> are equal if they contain the same elements: a HashSet equals a TreeSet with the same contents.|Maps are equal if their entry sets are equal.|A List never equals a Set, and a Queue/Deque has only identity equality."]],
["Coding: group anagrams.","Intermediate",["c:Map&lt;String, List&lt;String&gt;&gt; groups = new HashMap&lt;&gt;();\nfor (String w : words) {\n    char[] c = w.toCharArray();\n    Arrays.sort(c);\n    groups.computeIfAbsent(new String(c), k -&gt; new ArrayList&lt;&gt;()).add(w);\n}","p:The sorted letters are the canonical key. O(n * k log k) for n words of length k."]],
["Coding: Two Sum in O(n).","Intermediate",["c:int[] twoSum(int[] a, int target) {\n    Map&lt;Integer, Integer&gt; idx = new HashMap&lt;&gt;();\n    for (int i = 0; i &lt; a.length; i++) {\n        Integer j = idx.get(target - a[i]);\n        if (j != null) return new int[]{j, i};\n        idx.put(a[i], i);\n    }\n    return null;\n}"]],
["Coding: find the first non-repeating character.","Intermediate",["c:Character firstUnique(String s) {\n    Map&lt;Character, Integer&gt; m = new LinkedHashMap&lt;&gt;();\n    for (char c : s.toCharArray()) m.merge(c, 1, Integer::sum);\n    for (Map.Entry&lt;Character, Integer&gt; e : m.entrySet())\n        if (e.getValue() == 1) return e.getKey();\n    return null;\n}","p:LinkedHashMap preserves first-seen order, giving O(n) time with one extra pass."]]]},
{t:"Expert-Level Architecture and Design Scenarios",qs:[
["Design a sliding-window rate limiter using collections.","Expert",["p:Keep a <code>ConcurrentHashMap&lt;String, Deque&lt;Long&gt;&gt;</code> mapping each client to timestamps of recent requests. On each request, lock that client's deque (or use <code>compute</code>), drop timestamps older than the window with <code>pollFirst</code>, and allow the request if <code>size &lt; limit</code>. Pitfalls: memory growth for idle clients (add expiry or periodic cleanup), clock changes (use <code>System.nanoTime</code>), and multi-node deployments, where the state must live in a shared store such as Redis."]],
["How do you serve a read-heavy configuration registry with occasional updates?","Expert",["p:Publish an <b>immutable snapshot</b> and swap it atomically. Readers never lock and always see a consistent view.","c:private volatile Map&lt;String, String&gt; config = Map.of();\nvoid reload(Map&lt;String, String&gt; fresh) { config = Map.copyOf(fresh); }\nString get(String k) { return config.get(k); }","p:This beats <code>CopyOnWriteArrayList</code>-style copying per change when updates are batched, and avoids read-write lock overhead. Use <code>AtomicReference</code> if you need compare-and-set."]],
["How do you process a dataset much larger than the heap?","Expert",["p:Do not load it into one collection. Stream it with bounded memory: database cursors or pagination, <code>Files.lines</code>/<code>BufferedReader</code>, and process in chunks. Keep only aggregates or a bounded structure (a heap of size k, a Bloom filter, a count-min sketch), use external sort/merge for sorting, or off-heap/disk-backed stores (Chronicle, MapDB, RocksDB) if state must persist. Size the heap with the boxed-object overhead in mind."]],
["How do you test that collection-related classes behave correctly?","Intermediate",["l:Use <b>EqualsVerifier</b> or property-based tests to check the <code>equals</code>/<code>hashCode</code>/<code>compareTo</code> contracts.|Test with null elements, empty collections, duplicates and mutated keys.|Run concurrency tests with jcstress or stress tests, since races rarely show up in single runs.|Use <code>assertEquals</code> on collections of the same kind (List vs List), and sort or use sets when order is not part of the contract."]]]},
{t:"Collection and Iterable Interface Details",qs:[
["Which important default methods does <code>Collection</code> provide?","Intermediate",["l:<code>removeIf(Predicate)</code> (Java 8): removes matching elements in one pass.|<code>stream()</code> / <code>parallelStream()</code> (Java 8) and <code>spliterator()</code>.|<code>toArray(IntFunction&lt;T[]&gt;)</code> (Java 11): <code>list.toArray(String[]::new)</code>.","p:<code>Iterable</code> adds <code>forEach</code>; <code>List</code> adds <code>replaceAll</code> and <code>sort</code>; <code>Map</code> adds <code>getOrDefault</code>, <code>putIfAbsent</code>, <code>compute*</code>, <code>merge</code>, <code>forEach</code>, <code>replaceAll</code>."]],
["What is the difference between <code>toArray()</code> and <code>toArray(new String[0])</code>?","Intermediate",["p:<code>toArray()</code> always returns <code>Object[]</code>, which cannot be cast to <code>String[]</code> (ClassCastException). The typed version returns an array of the requested runtime type; if the given array is too small a new one is allocated, otherwise it is filled (with a trailing <code>null</code> if larger than the size). Modern JVMs optimise the zero-length form, so prefer <code>toArray(new String[0])</code>, or <code>toArray(String[]::new)</code> on Java 11+, over pre-sizing."]],
["What does <code>size()</code> return for a collection with more than <code>Integer.MAX_VALUE</code> elements?","Advanced",["p:The contract says it returns <code>Integer.MAX_VALUE</code>, because <code>size()</code> is an <code>int</code>. Classes that can grow beyond that expose a <code>long</code> alternative, such as <code>ConcurrentHashMap.mappingCount()</code>. Array-backed collections cannot reach the limit anyway (maximum array length is slightly below <code>Integer.MAX_VALUE</code>)."]],
["What are <code>AbstractCollection</code>, <code>AbstractList</code> and friends for?","Advanced",["p:They are <b>skeletal implementations</b>: you implement a minimal set of methods (for a read-only list, just <code>get(int)</code> and <code>size()</code>) and inherit <code>iterator</code>, <code>contains</code>, <code>equals</code>, <code>hashCode</code>, <code>toString</code> and more. <code>AbstractList</code> also maintains the <code>modCount</code> used for fail-fast iteration. Extending them is the standard way to write a custom collection; prefer composition if you only need to decorate an existing one."]]]},
{t:"ArrayList in Depth",qs:[
["Why is ArrayList's backing array <code>transient</code>?","Advanced",["p:ArrayList defines custom <code>writeObject/readObject</code>: it serialises the <code>size</code> and then only the <b>used</b> elements, skipping the unused spare capacity. A default serialisation of the whole array would waste space on the null slots."]],
["How expensive is <code>add(index, e)</code> and how does it work?","Intermediate",["p:It checks <code>0 &lt;= index &lt;= size</code> (else <code>IndexOutOfBoundsException</code>), ensures capacity, shifts the tail right with <code>System.arraycopy</code> (a fast native bulk copy) and stores the element: O(n - index). Inserting at the front of a large list is therefore expensive; use <code>ArrayDeque</code> or batch inserts with <code>addAll(index, c)</code>, which shifts only once."]],
["What does <code>ArrayList.clear()</code> do to memory?","Intermediate",["p:It nulls out every slot (so elements become garbage-collectable) and sets the size to 0, but <b>keeps the backing array</b>, so capacity is retained. Use <code>trimToSize()</code> after clearing or replace the list with a new one if the list was huge and will stay small."]],
["Which operations on an empty ArrayList throw <code>IndexOutOfBoundsException</code>?","Beginner",["c:List&lt;String&gt; l = new ArrayList&lt;&gt;();\nl.add(0, \"a\");    // OK: index == size is allowed\nl = new ArrayList&lt;&gt;();\nl.get(0);        // IndexOutOfBoundsException\nl.set(0, \"x\");   // IndexOutOfBoundsException\nl.add(1, \"x\");   // IndexOutOfBoundsException (index &gt; size)\nl.remove(0);     // IndexOutOfBoundsException","p:Capacity is not size: <code>new ArrayList&lt;&gt;(100).get(0)</code> still fails. A negative initial capacity throws <code>IllegalArgumentException</code>."]],
["How do ArrayList's <code>contains</code>, <code>indexOf</code> and <code>remove(Object)</code> compare elements?","Beginner",["p:They use <code>equals</code>: <code>o == null ? e == null : o.equals(e)</code>, scanning from the start in O(n). Null elements are allowed and found correctly. They call <code>o.equals(element)</code>, so the argument's <code>equals</code> implementation matters. <code>lastIndexOf</code> scans from the end."]]]},
{t:"HashSet, LinkedHashSet and TreeSet in Depth",qs:[
["How does LinkedHashSet keep insertion order, and does re-adding an element change it?","Intermediate",["p:It is backed by a <code>LinkedHashMap</code>, which threads a doubly linked list through the entries. <b>Re-inserting</b> an element that is already present does not change its position (the add is a no-op). It costs one extra pair of references per entry compared with HashSet."]],
["Why can iterating a HashSet be slow even when it is nearly empty?","Advanced",["p:Iteration walks the whole bucket table, so the cost is O(size + capacity). A set that once held a million elements and was then cleared (<code>clear()</code> keeps capacity) or one created with a huge initial capacity is still slow to iterate. Create a fresh set, or use <code>LinkedHashSet</code>, whose iteration depends only on size."]],
["Which navigation methods does TreeSet provide?","Intermediate",["l:<code>first()</code>, <code>last()</code>, <code>pollFirst()</code>, <code>pollLast()</code>|<code>floor(e)</code> (&le;), <code>lower(e)</code> (&lt;), <code>ceiling(e)</code> (&ge;), <code>higher(e)</code> (&gt;), returning <code>null</code> if none|<code>headSet(to)</code>, <code>tailSet(from)</code>, <code>subSet(from, to)</code> are <b>views</b>; the end points are inclusive/exclusive as documented (<code>from</code> inclusive, <code>to</code> exclusive by default)|<code>descendingSet()</code>, <code>descendingIterator()</code>","p:Adding an element outside a view's range throws <code>IllegalArgumentException</code>."]],
["Can a TreeSet hold null?","Intermediate",["p:Not with natural ordering: <code>add(null)</code> throws <code>NullPointerException</code> (and even the first add calls <code>compare</code> since Java 7). With a custom comparator it depends on the comparator, so <code>new TreeSet&lt;&gt;(Comparator.nullsFirst(Comparator.naturalOrder()))</code> accepts nulls."]],
["How do you compute union, intersection and difference of two sets?","Beginner",["c:Set&lt;Integer&gt; union = new HashSet&lt;&gt;(a);   union.addAll(b);\nSet&lt;Integer&gt; inter = new HashSet&lt;&gt;(a);   inter.retainAll(b);\nSet&lt;Integer&gt; diff  = new HashSet&lt;&gt;(a);   diff.removeAll(b);\nSet&lt;Integer&gt; sym   = new HashSet&lt;&gt;(union); sym.removeAll(inter);","p:Copy first so the originals are untouched. When <code>b</code> is a Set these are O(n); if <code>b</code> is a List, <code>retainAll</code>/<code>removeAll</code> become O(n*m)."]]]},
{t:"LinkedList and List Operations",qs:[
["What are the special features of LinkedList beyond List?","Intermediate",["p:It also implements <code>Deque</code>, so it provides <code>addFirst/addLast</code>, <code>pollFirst/pollLast</code>, <code>peekFirst/peekLast</code>, <code>push/pop</code> and <code>removeFirstOccurrence</code>. It allows null elements (unlike ArrayDeque), and inserting through a <code>ListIterator</code> at the current position is O(1) once positioned. It is not thread-safe."]],
["How do you reverse a list in place, and what does Java 21 add?","Intermediate",["c:Collections.reverse(list);        // in place, O(n)\nlist.reversed();                    // Java 21+: reverse-ordered VIEW, no copying","p:<code>Collections.reverse</code> swaps pairs (O(n), O(1) extra space), using <code>ListIterator</code> for non-RandomAccess lists. The Java 21 <code>reversed()</code> view reflects later changes to the original, so copy it if you need a snapshot."]],
["What does <code>Collections.rotate</code> do?","Intermediate",["c:List&lt;Integer&gt; l = new ArrayList&lt;&gt;(List.of(1, 2, 3, 4));\nCollections.rotate(l, 1);    // [4, 1, 2, 3]\nCollections.rotate(l, -1);   // back to [1, 2, 3, 4]","p:A positive distance moves elements toward the end (wrapping around); the operation is in place and runs in O(n)."]]]},
{t:"Spliterator and Cloning Details",qs:[
["What is a Spliterator?","Advanced",["p:A <code>Spliterator</code> traverses and <b>partitions</b> a source for (parallel) streams. <code>tryAdvance</code> and <code>forEachRemaining</code> consume elements; <code>trySplit</code> hands off part of the data to another thread. It reports characteristics such as <code>ORDERED</code>, <code>SIZED</code>, <code>SORTED</code>, <code>DISTINCT</code>, <code>NONNULL</code>, <code>IMMUTABLE</code> and <code>CONCURRENT</code>; ArrayList splits evenly (cheap), while LinkedList splits poorly, which is why parallel streams over it rarely help."]],
["Is <code>ArrayList.clone()</code> a deep copy?","Intermediate",["p:No. It makes a <b>shallow copy</b>: a new backing array, but the same element references, so mutating an element is visible through both lists. ArrayList implements <code>Cloneable</code> and <code>Serializable</code> (the Collection interface itself does not). For independent copies, use the copy constructor for the list and copy each element yourself.","c:List&lt;Person&gt; copy = new ArrayList&lt;&gt;(src);                    // shallow\nList&lt;Person&gt; deep = src.stream().map(Person::new).toList();  // copy constructor per element"]]]},
{t:"Set Sizing, EnumSet and Set.of",qs:[
["How is a HashSet created from a collection sized?","Advanced",["p:<code>new HashSet&lt;&gt;(c)</code> allocates the backing HashMap with capacity <code>max(c.size() / 0.75f + 1, 16)</code>, so adding the elements does not trigger a resize. Passing a non-trivial initial capacity yourself is worthwhile when loading large sets."]],
["How does EnumSet make range and complement operations easy?","Intermediate",["c:enum Day { MON, TUE, WED, THU, FRI, SAT, SUN }\nSet&lt;Day&gt; weekdays = EnumSet.range(Day.MON, Day.FRI);\nSet&lt;Day&gt; weekend  = EnumSet.complementOf(weekdays);   // [SAT, SUN]\nSet&lt;Day&gt; all = EnumSet.allOf(Day.class), none = EnumSet.noneOf(Day.class);","p:Backed by a bit vector, these operations are essentially bit arithmetic."]],
["Output-based: <code>Set.of</code> with duplicates vs <code>HashSet</code>.","Intermediate",["c:Set&lt;String&gt; a = new HashSet&lt;&gt;(List.of(\"x\", \"x\"));    // fine, size 1\nSet&lt;String&gt; b = Set.of(\"x\", \"x\");                    // ?","p:The first line works (duplicates are silently ignored). The second throws <code>IllegalArgumentException: duplicate element: x</code> at creation. <code>Set.of(...)</code> treats a duplicate as a programming error; use <code>Set.copyOf(list)</code> if duplicates are possible in the input."]]]},
{t:"Streams and Collectors in Depth",qs:[
["How do you flatten nested collections?","Intermediate",["c:List&lt;List&lt;Integer&gt;&gt; nested = List.of(List.of(1, 2), List.of(3), List.of());\nList&lt;Integer&gt; flat = nested.stream().flatMap(List::stream).toList();   // [1, 2, 3]\nSet&lt;String&gt; words = lines.stream().flatMap(l -&gt; Arrays.stream(l.split(\"\\\\s+\"))).collect(Collectors.toSet());"]],
["What is the difference between <code>partitioningBy</code> and <code>groupingBy</code>?","Intermediate",["l:<code>partitioningBy(predicate)</code> always returns a map with <b>both</b> <code>true</code> and <code>false</code> keys (possibly empty lists).|<code>groupingBy(classifier)</code> uses any key type, and only creates keys for groups that exist.","c:Map&lt;Boolean, List&lt;Integer&gt;&gt; p = nums.stream().collect(Collectors.partitioningBy(n -&gt; n % 2 == 0));"]],
["What does <code>Collectors.teeing</code> do (Java 12)?","Advanced",["p:It runs two collectors over the same stream in a single pass and merges their results.","c:var r = nums.stream().collect(Collectors.teeing(\n    Collectors.counting(),\n    Collectors.summingInt(Integer::intValue),\n    (count, sum) -&gt; (double) sum / count));      // average in one pass"]],
["How do you join strings and compute statistics from a collection?","Beginner",["c:String s = names.stream().collect(Collectors.joining(\", \", \"[\", \"]\"));\nIntSummaryStatistics st = nums.stream().mapToInt(Integer::intValue).summaryStatistics();\nst.getMin(); st.getMax(); st.getAverage(); st.getSum(); st.getCount();"]],
["What are common stream pitfalls with collections?","Intermediate",["l:A stream can be consumed only once; reuse throws <code>IllegalStateException: stream has already been operated upon or closed</code>.|Do not modify the source collection while the stream pipeline is running.|Avoid side effects in <code>map</code>/<code>filter</code>; keep lambdas stateless.|<code>Stream.toList()</code> is unmodifiable; use <code>Collectors.toCollection(ArrayList::new)</code> when you need a mutable list."]]]},
{t:"Utilities and Edge Cases",qs:[
["How do you use <code>ListIterator</code> to modify a list while iterating?","Intermediate",["c:ListIterator&lt;String&gt; it = list.listIterator();\nwhile (it.hasNext()) {\n    String s = it.next();\n    if (s.isEmpty()) it.remove();           // delete the last returned element\n    else if (s.equals(\"a\")) it.set(\"A\");   // replace it\n    else if (s.equals(\"b\")) it.add(\"b2\");  // insert after b (before the cursor)\n}","p:<code>set</code> and <code>remove</code> are only valid right after <code>next/previous</code>; after an <code>add</code> they throw <code>IllegalStateException</code>."]],
["Compare <code>Arrays.equals</code>, <code>Arrays.deepEquals</code> and <code>==</code>.","Intermediate",["l:<code>==</code> compares references.|<code>Arrays.equals(a, b)</code> compares lengths and elements with <code>equals</code> (elements that are themselves arrays are compared by reference).|<code>Arrays.deepEquals</code> recurses into nested arrays. Likewise <code>Arrays.hashCode</code> vs <code>deepHashCode</code>, and <code>Arrays.toString</code> vs <code>deepToString</code>."]],
["Output-based: what do <code>Collections.rotate</code> and <code>swap</code> produce?","Intermediate",["c:List&lt;Integer&gt; l = new ArrayList&lt;&gt;(List.of(1, 2, 3, 4, 5));\nCollections.rotate(l, 2);\nCollections.swap(l, 0, 4);\nSystem.out.println(l);","p:Prints <code>[3, 5, 1, 2, 4]</code>. <code>rotate(l, 2)</code> shifts each element two positions right with wrap-around: <code>[4, 5, 1, 2, 3]</code>; then swapping indexes 0 and 4 gives <code>[3, 5, 1, 2, 4]</code>. A negative distance rotates left."]],
["What do <code>Collections.nCopies</code>, <code>frequency</code> and <code>disjoint</code> do?","Beginner",["c:List&lt;String&gt; c = Collections.nCopies(3, \"ab\");        // immutable [ab, ab, ab]\nint f = Collections.frequency(List.of(1, 2, 1), 1);    // 2\nboolean d = Collections.disjoint(List.of(1, 2), List.of(3)); // true","p:<code>nCopies</code> stores one element reference, so it is memory-cheap for large repeats, e.g. <code>String.join(\"\", Collections.nCopies(n, \"-\"))</code> (Java 11 also has <code>\"-\".repeat(n)</code>)."]]]},
{t:"Concurrent Collections in Depth",qs:[
["What bulk operations does ConcurrentHashMap provide?","Advanced",["p:<code>forEach</code>, <code>search</code>, <code>reduce</code> (and <code>*Keys/*Values/*Entries</code> variants) take a <b>parallelism threshold</b>: the estimated number of elements above which work is split across the common ForkJoinPool. <code>Long.MAX_VALUE</code> forces sequential execution, <code>1</code> maximum parallelism.","c:long total = map.reduceValues(1_000, Long::sum);\nmap.forEach(1_000, (k, v) -&gt; process(k, v));"]],
["ConcurrentLinkedQueue vs LinkedBlockingQueue: how do they differ?","Advanced",["l:<code>ConcurrentLinkedQueue</code> is unbounded, <b>lock-free</b> (CAS, Michael-Scott algorithm) and non-blocking: <code>poll()</code> returns null when empty. <code>size()</code> is O(n) and may be inaccurate.|<code>LinkedBlockingQueue</code> is lock-based, optionally bounded and offers blocking <code>put/take</code> for producer-consumer hand-off with back-pressure."]],
["Output-based: what happens when you add to a CopyOnWriteArrayList while iterating it?","Advanced",["c:List&lt;Integer&gt; cow = new CopyOnWriteArrayList&lt;&gt;(List.of(1, 2, 3));\nfor (int x : cow) cow.add(x + 10);\nSystem.out.println(cow);","p:The loop runs exactly <b>3 times</b> (over the snapshot taken when the iterator was created) with no exception, and prints <code>[1, 2, 3, 11, 12, 13]</code>. Each <code>add</code> copies the whole array, which is why it suits read-mostly data."]],
["Which ConcurrentHashMap operations are NOT atomic as a whole?","Expert",["p:Single-key operations (<code>put</code>, <code>putIfAbsent</code>, <code>compute*</code>, <code>merge</code>) are atomic. Aggregate operations such as <code>putAll</code>, <code>size()</code>, <code>isEmpty()</code>, <code>containsValue</code> and iteration are <b>not atomic snapshots</b>: concurrent updates may be partly visible, and the size is only an estimate while writers are active. Never use <code>size()</code> for decisions like \"if empty then initialise\"; use <code>putIfAbsent</code>/<code>computeIfAbsent</code>."]],
["How do you implement a high-throughput concurrent counter map?","Expert",["c:ConcurrentHashMap&lt;String, LongAdder&gt; counts = new ConcurrentHashMap&lt;&gt;();\ncounts.computeIfAbsent(key, k -&gt; new LongAdder()).increment();\nlong n = counts.get(key).sum();","p:<code>LongAdder</code> spreads contention across cells, outperforming <code>AtomicLong</code> under heavy write contention. <code>merge(key, 1L, Long::sum)</code> is simpler and fine at moderate rates."]]]},
{t:"Sorting and Ordering Scenarios",qs:[
