["Why does <code>compareTo</code> sort strings in a surprising order, and what are the alternatives?","Intermediate",["p:<code>String.compareTo</code> compares UTF-16 code units, so all uppercase letters sort before lowercase (\"Z\" &lt; \"a\") and accented letters come after \"z\". Alternatives: <code>String.CASE_INSENSITIVE_ORDER</code> (ignores case only) or <code>java.text.Collator</code> for <b>locale-aware</b> ordering.","c:list.sort(Collator.getInstance(Locale.FRANCE));"]],
["Output-based: demonstrate stable sorting.","Intermediate",["c:List&lt;String&gt; l = new ArrayList&lt;&gt;(List.of(\"bb\", \"a\", \"aa\", \"b\"));\nl.sort(Comparator.comparingInt(String::length));\nSystem.out.println(l);","p:Prints <code>[a, b, bb, aa]</code>. The sort is stable, so equal-length elements keep their original relative order (\"a\" before \"b\", \"bb\" before \"aa\"). Stability lets you sort by one key, then by another, to build multi-key orderings."]],
["Does <code>stream().sorted()</code> change the source list, and is it stable?","Intermediate",["p:No, the source is untouched; the sorted result is a new stream. For an <b>ordered</b> stream the sort is stable. Use <code>list.sort(...)</code> to sort in place; use <code>sorted()</code> when you want a sorted copy or the data is already flowing through a pipeline."]]]},
{t:"Complexity and Internals Quick-Fire",qs:[
["Why is <code>ArrayList.add</code> amortised O(1) even though some calls copy the whole array?","Advanced",["p:Growth is geometric (x1.5). Across n appends the total element copying is a geometric series bounded by a small constant times n (about 3n for factor 1.5, 2n for doubling), so the average cost per add is constant. A single add can still cause a latency spike, which matters in real-time code: presize if the size is known."]],
["PriorityQueue vs TreeSet for priority handling: what are the trade-offs?","Advanced",["l:<b>PriorityQueue</b>: allows duplicates, <code>peek</code> O(1), <code>offer/poll</code> O(log n), arbitrary <code>remove</code> O(n), no ordered iteration.|<b>TreeSet</b>: rejects elements that compare equal, <code>first()</code> O(log n), arbitrary <code>remove</code> O(log n), sorted iteration and range queries.","p:Use PriorityQueue for a simple scheduler; use a TreeSet/TreeMap when you must cancel or reprioritise items."]],
["How are <code>hashCode</code> values of List, Set and Map defined?","Advanced",["l:<b>List</b>: <code>h = 1; for each e: h = 31*h + hash(e)</code> (so order matters; the empty list is 1).|<b>Set</b>: sum of element hash codes (order-independent).|<b>Map</b>: sum of entry hash codes, each being <code>keyHash ^ valueHash</code>.","p:These are specified in the Javadoc so that equal collections of different implementations have equal hashes."]],
["Output-based: two different Strings with the same hash code in a HashMap.","Advanced",["c:Map&lt;String, Integer&gt; m = new HashMap&lt;&gt;();\nm.put(\"Aa\", 1); m.put(\"BB\", 2);\nSystem.out.println((\"Aa\".hashCode() == \"BB\".hashCode()) + \" \" + m.size() + \" \" + m.get(\"BB\"));","p:Prints <code>true 2 2</code>. Both strings hash to 2112, so they share a bucket, but <code>equals</code> distinguishes them, so both entries are stored and found correctly. Colliding hash codes affect speed, not correctness."]]]},
{t:"Design Patterns with Collections",qs:[
["How should an observer/listener list be implemented safely?","Advanced",["p:A plain ArrayList throws <code>ConcurrentModificationException</code> if a listener unregisters itself while being notified, and is unsafe across threads. Use <code>CopyOnWriteArrayList</code> (notification iterates a snapshot, registration is rare). Also guard against the <b>lapsed listener</b> leak by always unregistering, or holding listeners through weak references."]],
["How do you shut down a producer-consumer with a BlockingQueue cleanly?","Expert",["c:static final Task POISON = new Task();   // sentinel\n// producer, when done:  for (int i = 0; i &lt; consumers; i++) queue.put(POISON);\n// consumer:\nfor (;;) {\n    Task t = queue.take();\n    if (t == POISON) break;\n    process(t);\n}","p:Send one poison pill per consumer. Alternatives: interrupt the consumers, or use an <code>ExecutorService</code> and <code>shutdown()</code> plus <code>awaitTermination</code>."]],
["How do you implement a multimap (one key, many values)?","Intermediate",["c:Map&lt;String, List&lt;String&gt;&gt; mm = new HashMap&lt;&gt;();\nmm.computeIfAbsent(\"fruit\", k -&gt; new ArrayList&lt;&gt;()).add(\"apple\");\n\nvoid remove(String k, String v) {\n    List&lt;String&gt; l = mm.get(k);\n    if (l != null &amp;&amp; l.remove(v) &amp;&amp; l.isEmpty()) mm.remove(k);   // avoid empty buckets\n}","p:Use a Set as the value type if duplicates are not wanted. Guava's <code>Multimap</code> wraps these details."]],
["How do you build a bidirectional map?","Intermediate",["p:Keep two maps, <code>key-&gt;value</code> and <code>value-&gt;key</code>, and update both together (inside one lock if shared). Values must be unique, so decide what happens on a duplicate value: reject or evict the old key. Guava's <code>BiMap</code> (<code>HashBiMap</code>, <code>inverse()</code>, <code>forcePut</code>) provides this ready-made."]],
["Coding: breadth-first search on a graph using collections.","Intermediate",["c:Map&lt;Integer, List&lt;Integer&gt;&gt; g = ...;                 // adjacency list\nSet&lt;Integer&gt; seen = new HashSet&lt;&gt;(List.of(start));\nDeque&lt;Integer&gt; q = new ArrayDeque&lt;&gt;(List.of(start));\nwhile (!q.isEmpty()) {\n    int u = q.poll();\n    for (int v : g.getOrDefault(u, List.of()))\n        if (seen.add(v)) q.add(v);       // add() false means already visited\n}","p:O(V + E). Use a Deque as a stack (<code>push/pop</code>) instead of the queue for depth-first search."]]]},
{t:"TreeMap and Red-Black Tree Internals",qs:[
["How does a red-black tree keep TreeMap balanced?","Expert",["p:Every node is red or black; the root is black; a red node never has a red child; every path from a node to its leaves has the same number of black nodes. These rules bound the height to about <code>2 * log2(n + 1)</code>, so <code>get/put/remove</code> are O(log n) in the <b>worst case</b>. Inserts and deletes restore the rules with recolouring and at most a few rotations. Each <code>TreeMap.Entry</code> stores key, value, left, right, parent and a colour flag."]],
["When does TreeMap beat HashMap?","Intermediate",["l:You need <b>sorted iteration</b> or navigation (<code>floorKey</code>, <code>ceilingKey</code>, range views).|You need a guaranteed O(log n) worst case regardless of hash quality.|Keys have a natural order but no good <code>hashCode</code>.","p:Otherwise HashMap is faster (O(1) average) and uses less memory per entry than a tree node."]],
["What is the cost of TreeMap sub-map views?","Advanced",["p:Creating <code>headMap/tailMap/subMap</code> is O(log n) (no copying), and the view is backed by the map. However <code>size()</code> on a restricted view is typically O(n), because it counts by iterating the range, so avoid calling it in loops."]],
["What happens if you mutate a key's comparison field after inserting it into a TreeMap?","Advanced",["p:The tree was ordered using the old value. After the change, the node sits in the wrong place, so <code>get</code>, <code>containsKey</code> and <code>remove</code> can miss it and the structure becomes inconsistent. As with HashMap, use <b>immutable keys</b> (or remove, change and re-insert)."]]]},
{t:"Hashtable and Legacy Classes",qs:[
["How does Hashtable differ from HashMap internally?","Intermediate",["l:Every public method is <code>synchronized</code>.|Neither null keys nor null values are allowed.|Default capacity <b>11</b>, rehash to <code>2 * old + 1</code>; index is <code>(hash &amp; 0x7FFFFFFF) % table.length</code> (modulo, not a bit-mask).|No treeification; legacy <code>Enumeration</code> views plus fail-fast iterators."]],
["What is <code>java.util.Properties</code>?","Beginner",["p:A <code>Hashtable&lt;Object, Object&gt;</code> subclass for string configuration. Use <code>getProperty(key, default)</code>/<code>setProperty</code> and <code>load/store</code> for <code>.properties</code> files. Avoid <code>put</code> with non-String values: <code>getProperty</code> would ignore them. It supports a chain of <b>defaults</b>.","c:Properties p = new Properties();\ntry (InputStream in = Files.newInputStream(Path.of(\"app.properties\"))) { p.load(in); }\nint port = Integer.parseInt(p.getProperty(\"port\", \"8080\"));"]],
["Which legacy collection classes still exist and what replaces them?","Beginner",["l:<code>Vector</code> -&gt; <code>ArrayList</code> (or <code>CopyOnWriteArrayList</code>)|<code>Stack</code> -&gt; <code>ArrayDeque</code>|<code>Hashtable</code> -&gt; <code>HashMap</code> / <code>ConcurrentHashMap</code>|<code>Enumeration</code> -&gt; <code>Iterator</code>|<code>Dictionary</code> -&gt; <code>Map</code>","p:They remain for backward compatibility and are used by older APIs (e.g. <code>Properties</code>)."]]]},
{t:"Advanced Generics",qs:[
["Write a generic <code>max</code> with a recursive bound. Why <code>Comparable&lt;? super T&gt;</code>?","Expert",["c:static &lt;T extends Comparable&lt;? super T&gt;&gt; T max(Collection&lt;? extends T&gt; c) {\n    Iterator&lt;? extends T&gt; it = c.iterator();\n    T best = it.next();\n    while (it.hasNext()) { T x = it.next(); if (x.compareTo(best) &gt; 0) best = x; }\n    return best;\n}","p:<code>? super T</code> lets a class inherit its ordering from a parent: if <code>Apple extends Fruit implements Comparable&lt;Fruit&gt;</code>, <code>max</code> still works on a <code>List&lt;Apple&gt;</code>."]],
["Generic method or wildcard: how do you choose?","Advanced",["p:Use a <b>wildcard</b> when the type appears only once and you do not need to name it (<code>void print(Collection&lt;?&gt; c)</code>). Use a <b>type parameter</b> when you must relate several types (<code>&lt;T&gt; void copy(List&lt;T&gt; dst, List&lt;T&gt; src)</code>) or tie the return type to an argument (<code>&lt;T&gt; T first(List&lt;T&gt; l)</code>)."]],
["What is wildcard capture and the helper-method idiom?","Expert",["c:static void swap(List&lt;?&gt; l, int i, int j) { swapHelper(l, i, j); }\nprivate static &lt;T&gt; void swapHelper(List&lt;T&gt; l, int i, int j) {\n    T t = l.get(i); l.set(i, l.get(j)); l.set(j, t);\n}","p:You cannot call <code>l.set(..., l.get(..))</code> directly on <code>List&lt;?&gt;</code> because each <code>?</code> is a different unknown type. A generic helper lets the compiler capture the wildcard as a named type <code>T</code>."]],
["What is heap pollution with generic varargs and what does <code>@SafeVarargs</code> do?","Expert",["p:A varargs parameter of generic type (<code>T...</code>) creates an array of the erased type, which can be exposed or filled with wrong types, causing <code>ClassCastException</code> later. <code>@SafeVarargs</code> asserts that the method does not store into or leak the array, suppressing the warning. It is allowed on static, final and private methods and constructors. <code>Arrays.asList</code> and <code>List.of</code> are annotated this way."]],
["Why do two overloads differing only in generic type arguments not compile, and what are bridge methods?","Expert",["c:void f(List&lt;String&gt; a) { }\nvoid f(List&lt;Integer&gt; a) { }   // error: name clash, same erasure","p:Both erase to <code>f(List)</code>. <b>Bridge methods</b> are synthetic methods the compiler adds to keep polymorphism working after erasure: a class <code>Person implements Comparable&lt;Person&gt;</code> gets a hidden <code>compareTo(Object)</code> that casts and calls <code>compareTo(Person)</code>."]]]},
{t:"Iterator Edge Cases and Map Iteration",qs:[
["Output-based: what happens when you call <code>Iterator.remove()</code> twice?","Intermediate",["c:Iterator&lt;Integer&gt; it = new ArrayList&lt;&gt;(List.of(1, 2, 3)).iterator();\nit.next();\nit.remove();\nit.remove();","p:The second <code>remove()</code> throws <code>IllegalStateException</code>. <code>remove</code> is allowed only once per <code>next()</code> call, and calling it before the first <code>next()</code> also throws."]],
["What is the most efficient way to iterate over a Map?","Beginner",["c:for (Map.Entry&lt;String, Integer&gt; e : map.entrySet()) use(e.getKey(), e.getValue());\nmap.forEach((k, v) -&gt; use(k, v));                 // Java 8+\n// avoid: for (String k : map.keySet()) map.get(k);  // extra lookup per key","p:<code>entrySet()</code> gives key and value together without a second hash lookup. For a <code>TreeMap</code> the extra <code>get</code> costs O(log n) each time."]],
["How does the enhanced for loop compile for arrays and for Iterables?","Intermediate",["p:For an array it becomes an <b>index loop</b> over a copy of the array reference and its length. For an <code>Iterable</code> it becomes <code>for (Iterator&lt;T&gt; it = x.iterator(); it.hasNext();) { T v = it.next(); ... }</code>. That is why modifying the collection inside for-each can throw <code>ConcurrentModificationException</code>, while changing an array's elements is fine."]]]},
{t:"Modern Java and Collections",qs:[
["How do records help when used as collection elements or keys?","Intermediate",["c:record Team(String name, List&lt;String&gt; members) {\n    Team { members = List.copyOf(members); }   // compact constructor: defensive copy\n}","p:Records generate <code>equals</code>, <code>hashCode</code> and <code>toString</code> from all components, so they are ideal map keys and set elements. A record is only <i>shallowly</i> immutable: a mutable component (like a plain List) can still change, so copy it in the compact constructor."]],
["How do virtual threads (Java 21+) affect choices between synchronized and concurrent collections?","Expert",["p:Blocking inside a <code>synchronized</code> block <b>pins</b> a virtual thread to its carrier in Java 21–23, which can limit scalability; JEP 491 removed most of this pinning in Java 24. Concurrent collections (<code>ConcurrentHashMap</code>, <code>BlockingQueue</code>) use CAS or <code>ReentrantLock</code> and work well with virtual threads. Keep critical sections short and never perform blocking I/O while holding a collection's monitor."]],
["What are Stream Gatherers (Java 24)?","Expert",["p:Gatherers (<code>Stream.gather</code>, JEP 485, final in Java 24) add custom intermediate operations to streams. Built-ins in <code>java.util.stream.Gatherers</code> include <code>windowFixed</code>, <code>windowSliding</code>, <code>fold</code>, <code>scan</code> and <code>mapConcurrent</code>.","c:var windows = Stream.of(1, 2, 3, 4, 5)\n    .gather(Gatherers.windowFixed(2)).toList();   // [[1, 2], [3, 4], [5]]"]]]},
{t:"HashMap Scenarios and Output Puzzles",qs:[
["Output-based: why does <code>get(1L)</code> return null?","Intermediate",["c:Map&lt;Integer, String&gt; m = new HashMap&lt;&gt;();\nm.put(1, \"one\");\nSystem.out.println(m.get(1L));","p:Prints <code>null</code>. <code>get(Object)</code> accepts any type, and <code>Long.valueOf(1).equals(Integer.valueOf(1))</code> is false (different classes), so the key is not found. The compiler does not warn because the parameter is <code>Object</code>; keep key types consistent."]],
["Output-based: <code>0.0</code>, <code>-0.0</code> and <code>NaN</code> as keys.","Advanced",["c:Map&lt;Double, String&gt; m = new HashMap&lt;&gt;();\nm.put(0.0, \"a\"); m.put(-0.0, \"b\");\nm.put(Double.NaN, \"c\"); m.put(Double.NaN, \"d\");\nSystem.out.println(m.size());","p:Prints <code>3</code>. <code>Double.equals</code> compares the bit patterns: <code>0.0</code> and <code>-0.0</code> are different keys, while <code>NaN</code> equals <code>NaN</code> (so the second NaN replaces the first). This differs from the primitive <code>==</code> operator."]],
["What do <code>compute</code>, <code>computeIfPresent</code> and <code>putIfAbsent</code> do with nulls?","Advanced",["l:<code>compute</code> / <code>computeIfPresent</code>: if the remapping function returns <b>null</b>, the entry is <b>removed</b>.|<code>putIfAbsent(k, v)</code> also writes when the key is currently mapped to <code>null</code> (HashMap).|<code>merge(k, v, f)</code>: if <code>f</code> returns null the entry is removed; <code>v</code> itself must not be null."]],
["Why are arrays poor HashMap keys, and what do you use instead?","Intermediate",["p:Arrays use <b>identity</b> <code>equals</code>/<code>hashCode</code>, so two arrays with the same contents are different keys. Use <code>List.of(...)</code>/<code>Arrays.asList</code>, a record, or a wrapper that uses <code>Arrays.equals</code> and <code>Arrays.hashCode</code>. For a String-like key, <code>String.valueOf(chars)</code> works."]],
["How do you handle a missing key safely when unboxing a Map value?","Beginner",["c:int v = map.get(\"x\");                    // NullPointerException if absent\nint ok = map.getOrDefault(\"x\", 0);         // safe\nInteger boxed = map.get(\"x\");              // check for null explicitly","p:A null return from <code>get</code> triggers an NPE when unboxed to a primitive. This is a classic source of intermittent production errors."]]]},
{t:"Queue and Deque Scenarios",qs:[
["How do you build a bounded queue that evicts the oldest element?","Intermediate",["c:class Recent&lt;E&gt; {\n    private final Deque&lt;E&gt; q = new ArrayDeque&lt;&gt;(); private final int cap;\n    Recent(int cap) { this.cap = cap; }\n    synchronized void add(E e) { if (q.size() == cap) q.pollFirst(); q.addLast(e); }\n}","p:Libraries offer this ready-made (Guava <code>EvictingQueue</code>, Commons <code>CircularFifoQueue</code>). <code>ArrayBlockingQueue</code> blocks instead of evicting."]],
["When would you use <code>DelayQueue</code>?","Advanced",["p:Elements implement <code>Delayed</code>; <code>take()</code> blocks until the head element's delay has expired. It is an unbounded, time-ordered queue, suited to retry scheduling, TTL expiry and timeouts. Only expired elements can be removed; <code>peek</code> may return one that is not yet expired."]],
["How do you get FIFO order among equal priorities in a PriorityQueue?","Advanced",["p:PriorityQueue is not stable. Add a monotonically increasing sequence number and use it as a tie-breaker.","c:record Job(int priority, long seq, Runnable task) {}\nAtomicLong counter = new AtomicLong();\nPriorityQueue&lt;Job&gt; pq = new PriorityQueue&lt;&gt;(\n    Comparator.comparingInt(Job::priority).thenComparingLong(Job::seq));\npq.add(new Job(1, counter.incrementAndGet(), task));"]],
["Coding: check balanced parentheses with a Deque.","Intermediate",["c:boolean balanced(String s) {\n    Deque&lt;Character&gt; st = new ArrayDeque&lt;&gt;();\n    for (char c : s.toCharArray()) {\n        if (c == '(' || c == '[' || c == '{') st.push(c);\n        else if (c == ')' || c == ']' || c == '}') {\n            if (st.isEmpty()) return false;\n            char o = st.pop();\n            if ((c == ')' &amp;&amp; o != '(') || (c == ']' &amp;&amp; o != '[') || (c == '}' &amp;&amp; o != '{')) return false;\n        }\n    }\n    return st.isEmpty();\n}"]]]},
{t:"List Behaviours and Output Puzzles",qs:[
["Output-based: is <code>set</code> during iteration a modification error?","Intermediate",["c:List&lt;String&gt; l = new ArrayList&lt;&gt;(List.of(\"a\", \"b\"));\nfor (String s : l) l.set(0, \"x\");\nSystem.out.println(l);","p:Prints <code>[x, b]</code> with no exception. <code>set</code> replaces an element but is not a <i>structural</i> modification (size does not change, <code>modCount</code> is untouched), so the iterator is not invalidated."]],
["Output-based: initial capacity vs size.","Beginner",["c:List&lt;Integer&gt; l = new ArrayList&lt;&gt;(10);\nl.get(0);","p:Throws <code>IndexOutOfBoundsException</code> (index 0, length 0). The constructor argument is only the <b>capacity</b> of the backing array; the list's <code>size()</code> is still 0. To prefill use <code>new ArrayList&lt;&gt;(Collections.nCopies(10, 0))</code>."]],
["Output-based: sorting a list of mixed types.","Intermediate",["c:List&lt;Object&gt; l = new ArrayList&lt;&gt;(List.of(1, \"a\"));\nl.sort(null);   // natural ordering","p:Throws <code>ClassCastException</code>: <code>Integer</code> and <code>String</code> cannot be compared with each other. <code>sort(null)</code> means natural ordering, which requires mutually comparable elements."]],
["What are the ways to replace all elements of a list?","Beginner",["c:list.replaceAll(String::toUpperCase);              // Java 8+, UnaryOperator\nCollections.replaceAll(list, \"old\", \"new\");      // replace one value\nCollections.fill(list, \"x\");                      // overwrite every position\nListIterator&lt;String&gt; it = list.listIterator(); while (it.hasNext()) it.set(f(it.next()));"]]]},
{t:"Troubleshooting Production Issues",qs:[
["Why is a loop calling <code>list.remove(0)</code> so slow on a large ArrayList?","Advanced",["p:Each <code>remove(0)</code> shifts all remaining elements, O(n), so draining n items is O(n&sup2;). Use <code>removeIf</code> or build a new list, process then <code>clear()</code>, iterate with an <code>ArrayDeque</code> (<code>poll()</code> is O(1)), or remove from the end."]],
["A <code>StackOverflowError</code> appears in <code>hashCode</code> or <code>toString</code>. Why with collections?","Expert",["p:Object graphs with cycles, such as parent and child holding references to each other, or a collection containing itself, make generated <code>hashCode</code>/<code>toString</code>/<code>equals</code> recurse forever. <code>list.add(list); list.hashCode()</code> overflows the stack (<code>toString</code> guards the direct case with \"(this Collection)\"). Fix by excluding the back-reference from <code>equals/hashCode/toString</code> (e.g. Lombok <code>@EqualsAndHashCode.Exclude</code>)."]],
["Why do JPA/Hibernate entities misbehave in a HashSet?","Expert",["p:If <code>hashCode</code> uses the database-generated id, it changes when the entity is first saved (null to a number), so a HashSet or HashMap key stored beforehand is lost. Also lazy proxies compare unequal to real instances if <code>equals</code> uses <code>getClass()</code>. Base equality on a stable <b>business key</b> (natural id) or a constant <code>hashCode</code> with an id-aware <code>equals</code>, and keep it consistent for all states."]],
["Design: how do you handle a duplicate-suppression requirement over a very large stream of ids?","Expert",["p:An exact <code>HashSet&lt;Long&gt;</code> costs several tens of bytes per id. Options: <code>BitSet</code> when ids are dense integers (about 12.5 MB for 100 million ids); a <b>Bloom filter</b> (Guava) when a small false-positive rate is acceptable; a time-windowed set that expires old ids; or an external store (Redis, a database unique index) when state must survive restarts.","c:BitSet seen = new BitSet();\nif (!seen.get(id)) { seen.set(id); process(id); }"]]]},
{t:"Expert Design Scenarios II",qs:[
["Design a cache with per-entry expiry (TTL) using JDK collections.","Expert",["p:Store <code>Entry(value, expiresAtNanos)</code> in a <code>ConcurrentHashMap</code>. On <code>get</code>, return and evict lazily if expired; a scheduled task or a <code>DelayQueue</code> removes stale entries so memory is reclaimed. Prevent a stampede for the same key with <code>computeIfAbsent</code> (keep the loader short) or a <code>Future</code> per key. Add a size bound and an eviction policy; for production use <b>Caffeine</b> (<code>expireAfterWrite</code>, <code>maximumSize</code>, stats)."]],
["Design a leaderboard that supports score updates and top-K queries.","Expert",["p:Keep <code>Map&lt;Player, Score&gt;</code> for O(1) lookup plus a sorted structure ordered by (score desc, id): a <code>TreeSet</code> (or <code>ConcurrentSkipListSet</code> for concurrency). To update, remove the old entry, then insert the new one; top-K is iteration over the first K. If updates are heavy and exact order is rarely needed, use a heap with <b>lazy deletion</b> (stale entries are skipped on poll), or Redis sorted sets for distributed ranking."]],
["What is <code>BitSet</code> and when does it beat a <code>Set&lt;Integer&gt;</code>?","Intermediate",["p:A growable bit vector backed by a <code>long[]</code>. <code>set/get/clear</code> are O(1), and <code>and/or/xor/andNot</code> perform set operations 64 elements at a time. For dense non-negative integers it uses a tiny fraction of the memory of <code>HashSet&lt;Integer&gt;</code> (one bit per value instead of a node plus a boxed Integer), e.g. a sieve of Eratosthenes or visited flags. It is poor for sparse, huge ids and is not thread-safe."]]]},
{"t":"Collection Fundamentals: Contracts and Semantics","qs":[["Does Collection.equals compare elements in the same order?","Intermediate",["p:For Lists, equality requires the same elements in the same order. Sets compare membership without order. The Collection interface itself does not define one universal equality rule; implementations follow their specific contracts."]],["Can two different List implementations be equal?","Beginner",["p:Yes. An ArrayList and LinkedList containing equal elements in the same order compare equal because List defines equality by ordered element comparison."]],["What does Collection.remove(Object) remove when duplicates exist?","Beginner",["p:It removes only the first occurrence equal to the supplied object and returns true. Use a loop or removeIf when every matching occurrence must be removed."]],["What does containsAll mean for a collection?","Beginner",["p:It returns true when every element in the argument is present in the receiver. It does not compare multiplicities, so a list containing one 'x' can containAll a list containing two 'x' values."]],["Is Collection.add guaranteed to insert the supplied object?","Intermediate",["p:No. Set.add may return false when an equal element already exists. Other implementations can reject elements or operations, and queues may impose capacity restrictions."]],["What is the difference between size() and isEmpty()?","Beginner",["p:size() returns the number of elements; isEmpty() tests whether that number is zero. Concurrent collections may provide only transient observations while other threads modify them."]],["Can a collection contain itself?","Advanced",["p:Some mutable collections permit adding themselves, but operations such as toString, equals or hashCode can then recurse or behave unexpectedly. Avoid self-referential collection graphs unless an API explicitly supports them."]],["What does retainAll do?","Beginner",["p:It removes from the receiver every element not present in the supplied collection, leaving the intersection. It may throw UnsupportedOperationException when mutation is unsupported."]],["Does addAll preserve duplicates?","Intermediate",["p:It attempts to add every supplied element. A List preserves duplicates; a Set rejects elements that compare equal according to its equality or comparator rules."]]]},
{"t":"ArrayList: API and Behaviour","qs":[["What does ensureCapacity change in ArrayList?","Intermediate",["p:It increases backing-array capacity when necessary but does not change size or add elements. It is useful when the expected number of additions is known."]],["Does ArrayList.set change its structural modification count?","Advanced",["p:No. Replacing an element at an existing index is not a structural modification, so it normally does not invalidate an iterator through modCount."]],["What happens when ArrayList.get is called with size() as the index?","Beginner",["p:It throws IndexOutOfBoundsException. Valid indices range from zero through size()-1."]],["Does ArrayList allow null elements?","Beginner",["p:Yes. It can contain multiple null references, and contains(null) can find one."]],["What is the result of new ArrayList&lt;&gt;(anotherList)?","Beginner",["p:It creates a new, independently modifiable list containing the same element references in iteration order. It is a shallow copy; mutable element objects are shared."]],["What does ArrayList.clone return?","Advanced",["p:It returns a shallow copy of the ArrayList with a separate backing array. The elements themselves are not cloned."]],["Why is repeated add(0, value) expensive?","Intermediate",["p:Each insertion shifts existing elements one position to the right. Repeating it n times can require O(n squared) total element moves."]],["What is the complexity of ArrayList indexOf?","Beginner",["p:O(n) in the worst case because it scans elements using equality checks until a match is found."]],["Does trimming an ArrayList reduce its size?","Beginner",["p:No. trimToSize reduces capacity to match the current size; size and contents remain unchanged."]]]},
{"t":"LinkedList: API and Behaviour","qs":[["Does LinkedList implement RandomAccess?","Beginner",["p:No. Indexed access requires traversal, so it does not implement the RandomAccess marker interface."]],["What does LinkedList.removeFirst do on an empty list?","Beginner",["p:It throws NoSuchElementException. pollFirst instead returns null when the deque is empty."]],["Can LinkedList store null?","Beginner",["p:Yes, unlike ArrayDeque. However, null can make methods such as pollFirst ambiguous because null is also used to indicate an empty deque."]],["What is the complexity of addLast on LinkedList?","Intermediate",["p:O(1), because LinkedList maintains a reference to its tail node."]],["Why is LinkedList memory overhead higher than ArrayList?","Intermediate",["p:Each linked node stores the element reference plus previous and next links and object-header overhead. ArrayList stores references contiguously in an array."]],["What does descendingIterator return?","Intermediate",["p:It returns an iterator that traverses a Deque from tail to head. It does not create a reversed copy."]],["Can LinkedList be used as a Queue?","Beginner",["p:Yes. It implements Deque and Queue, supporting offer, poll and peek as well as operations at both ends."]],["What is the difference between remove() and removeFirst() on LinkedList?","Intermediate",["p:Both remove the first element and throw NoSuchElementException when empty. remove() is the Queue/Deque head-removal method; removeFirst makes the end explicit."]],["Does LinkedList.getLast modify the list?","Beginner",["p:No. It reads the tail element and throws NoSuchElementException if the list is empty."]]]},
{"t":"Set Semantics and Equality","qs":[["Can a Set contain null?","Intermediate",["p:It depends on the implementation. HashSet and LinkedHashSet allow one null; TreeSet with natural ordering rejects null; concurrent set implementations commonly reject it."]],["Can a Set contain two objects with the same hash code?","Beginner",["p:Yes. A hash collision does not mean objects are equal. A HashSet uses hashCode to locate candidates and equals to distinguish them."]],["Does HashSet preserve insertion order?","Beginner",["p:No. Its iteration order is unspecified and may change as the set is modified or resized. Use LinkedHashSet when insertion order matters."]],["What happens if equals is not symmetric?","Advanced",["p:The equals contract is broken. Collection behaviour can become inconsistent because comparisons may depend on which object is the receiver."]],["Can TreeSet store objects without Comparable?","Intermediate",["p:Yes, if its constructor receives a Comparator capable of comparing those objects. Otherwise insertion may throw ClassCastException when comparison is required."]],["What does TreeSet.add return for a comparator-equal element?","Intermediate",["p:It returns false and does not add a second element, even if equals would consider the objects different."]],["How do you preserve encounter order while removing duplicates?","Beginner",["p:Construct a LinkedHashSet from the source, or use stream().distinct() where the stream's encounter order is meaningful."]],["Is Set.of iteration order guaranteed?","Intermediate",["p:No. The iteration order of the immutable sets created by Set.of is unspecified and should not be used as a stable ordering."]],["What happens if a HashSet element's hashCode changes after insertion?","Advanced",["p:The element remains physically stored in its old bucket, while lookup/removal computes its new bucket. contains or remove may fail; avoid mutating equality-relevant state."]]]},
{"t":"HashMap: Core Operations","qs":[["What does HashMap.put return when replacing a non-null old value?","Beginner",["p:It returns the previous value associated with the key. If no mapping existed, it returns null; null return alone cannot distinguish absence from a previous null value."]],["How can you distinguish an absent key from a key mapped to null?","Intermediate",["p:Use containsKey(key) in addition to get(key). A HashMap permits null values, so get returning null is ambiguous."]],["Does HashMap allow duplicate values?","Beginner",["p:Yes. Keys must be unique according to hashCode and equals, but any number of keys can map to the same value."]],["Does HashMap preserve insertion order?","Beginner",["p:No. Use LinkedHashMap for insertion order or TreeMap for sorted key order."]],["What happens when two equal keys are inserted into HashMap?","Beginner",["p:The second put updates the mapping's value rather than creating another entry. The map size remains unchanged."]],["Can HashMap use a mutable object as a key?","Intermediate",["p:It can, but changing fields used by equals or hashCode after insertion can make the mapping unreachable by ordinary lookup. Prefer immutable keys."]],["What is the expected complexity of HashMap.get?","Intermediate",["p:Expected O(1) with a well-distributed hash function and controlled load. Collisions can worsen performance; tree bins mitigate many collision cases."]],["What does HashMap.remove return?","Beginner",["p:It returns the value previously associated with the key, or null if no mapping existed or the old value was null."]],["Does HashMap compute hashCode for a null key?","Advanced",["p:No. The null key is handled specially with a hash value of zero."]]]},
{"t":"HashMap: Output Prediction I","qs":[["Predict the output: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); m.put(\"a\",2); System.out.println(m.size()+\" \"+m.get(\"a\"));","Intermediate",["p:Output: 1 2. The second put replaces the value for the existing key."]],["Predict: Map&lt;String,String&gt; m=new HashMap&lt;&gt;(); m.put(null,\"x\"); m.put(null,\"y\"); System.out.println(m);","Intermediate",["p:The map contains one null key mapped to y. A HashMap supports one null key, and the second put replaces its value. The exact textual formatting is {null=y}."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",null); System.out.println(m.get(\"x\")==null);","Beginner",["p:Output: true. get returns null for a key mapped to null, as well as for a missing key; containsKey distinguishes those cases."]],["Predict: Map&lt;Integer,String&gt; m=new HashMap&lt;&gt;(); m.put(1,\"A\"); m.put(2,\"B\"); System.out.println(m.keySet().containsAll(List.of(1,2)));","Beginner",["p:Output: true. keySet is a live Set view containing the map's keys."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); m.put(\"b\",2); m.values().remove(1); System.out.println(m.size());","Intermediate",["p:Output: 1. values() is a live view; removing a value removes one corresponding mapping."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); m.put(\"b\",1); m.values().remove(1); System.out.println(m.size());","Advanced",["p:Output: 1. Collection.remove removes only one matching occurrence; the values view removes one mapping whose value equals 1."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); System.out.println(m.getOrDefault(\"b\",9));","Beginner",["p:Output: 9. The key b is absent, so getOrDefault returns the supplied default."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",null); System.out.println(m.getOrDefault(\"a\",9));","Advanced",["p:Output: null. getOrDefault returns the mapped value when the key is present, even if that value is null."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); m.replace(\"a\",2); System.out.println(m.get(\"a\"));","Beginner",["p:Output: 2. replace updates the value only when the key is already mapped."]]]},
{"t":"HashMap: Output Prediction II","qs":[["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); m.compute(\"a\",(k,v)-&gt;v+1); System.out.println(m);","Intermediate",["p:Output: {a=2}. compute receives the current value and stores the non-null result."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.computeIfAbsent(\"x\",k-&gt;4); System.out.println(m.get(\"x\"));","Beginner",["p:Output: 4. The mapping function runs because x has no non-null mapping."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",null); m.computeIfAbsent(\"x\",k-&gt;4); System.out.println(m.get(\"x\"));","Advanced",["p:Output: 4. For computeIfAbsent, a missing or null-valued mapping is treated as needing computation."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",2); m.merge(\"x\",3,Integer::sum); System.out.println(m.get(\"x\"));","Intermediate",["p:Output: 5. merge applies the remapping function when a non-null value is already present."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",2); m.merge(\"x\",3,(a,b)-&gt;null); System.out.println(m.containsKey(\"x\"));","Advanced",["p:Output: false. If the merge remapping function returns null, the mapping is removed."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",2); m.replace(\"x\",2,7); System.out.println(m.get(\"x\"));","Intermediate",["p:Output: 7. The conditional replace succeeds because the current value equals 2."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",2); System.out.println(m.remove(\"x\",3));","Intermediate",["p:Output: false. Conditional remove succeeds only when the key is mapped to the supplied value."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",2); m.put(\"y\",3); m.keySet().remove(2); System.out.println(m.size());","Advanced",["p:Output: 2. keySet.remove treats 2 as a key, not as a value; neither key matches."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"x\",2); m.entrySet().iterator().next().setValue(8); System.out.println(m.get(\"x\"));","Advanced",["p:The output is 8 if the iterator's first entry is the x mapping; with a one-entry map this is guaranteed. Map.Entry.setValue writes through to the map."]]]},
{"t":"LinkedHashMap and Access Order","qs":[["What constructor enables access-order LinkedHashMap?","Intermediate",["p:Use new LinkedHashMap&lt;&gt;(initialCapacity, loadFactor, true). The final true enables access order rather than insertion order."]],["Does calling get change an access-order LinkedHashMap?","Intermediate",["p:Yes. A successful access moves the entry to the most-recently-accessed end. This is why even reads need synchronization when sharing an access-order LRU map."]],["Does a failed get change access order?","Advanced",["p:No. A lookup that finds no mapping does not move an entry because no entry was accessed."]],["How do you implement a bounded LRU map?","Intermediate",["p:Subclass LinkedHashMap using accessOrder=true and override removeEldestEntry to return size()&gt;maximumCapacity. Add synchronization if shared across threads."]],["What does removeEldestEntry return true mean?","Intermediate",["p:It instructs LinkedHashMap to remove the eldest entry after insertion. It is commonly used to cap an LRU cache."]],["Does LinkedHashMap allow null keys and values?","Beginner",["p:Yes. It inherits HashMap's null-key and null-value support."]],["What order does a default LinkedHashMap use?","Beginner",["p:Insertion order. Updating an existing key does not normally move it to the end in insertion-order mode."]],["What happens if you remove and reinsert a key in insertion-order LinkedHashMap?","Intermediate",["p:The removed entry is gone; reinserting it creates a new entry at the end of insertion order."]],["Is LinkedHashMap iteration faster than HashMap iteration?","Advanced",["p:Iteration is proportional to the number of entries because it follows the linked encounter-order chain. HashMap iteration cost depends on table capacity plus size; exact performance depends on workload."]]]},
{"t":"TreeMap and NavigableMap","qs":[["What is the return value of TreeMap.firstKey on an empty map?","Beginner",["p:It throws NoSuchElementException. firstEntry instead returns null when the map is empty."]],["What does lowerEntry(key) return?","Intermediate",["p:It returns the entry with the greatest key strictly less than the supplied key, or null if none exists."]],["What is the difference between floorKey and ceilingKey?","Beginner",["p:floorKey returns the greatest key less than or equal to the query; ceilingKey returns the least key greater than or equal to it."]],["Are TreeMap subMap ranges inclusive?","Intermediate",["p:The two-argument SortedMap subMap(from,to) includes from and excludes to. NavigableMap overloads let you specify inclusivity explicitly."]],["Does TreeMap permit duplicate keys?","Beginner",["p:No. A key considered equal by the comparator replaces the existing mapping's value."]],["What happens if a TreeMap comparator returns zero for unequal keys?","Advanced",["p:TreeMap treats them as the same key, so a later put replaces the value rather than creating a second entry. Comparator consistency with equals is strongly recommended."]],["Can TreeMap use reverse key order?","Beginner",["p:Yes. Supply Comparator.reverseOrder() to the constructor, or use descendingMap() for a reverse-order view."]],["Is TreeMap thread-safe?","Beginner",["p:No. Use external synchronization or a concurrent sorted map such as ConcurrentSkipListMap when concurrent access is required."]],["What does pollLastEntry do?","Intermediate",["p:It removes and returns the entry with the greatest key, or returns null if the map is empty."]]]},
{"t":"Queue and Deque Contracts","qs":[["What does Queue.offer return when a bounded queue is full?","Intermediate",["p:It returns false rather than throwing an exception. add generally throws IllegalStateException when insertion cannot be performed."]],["What does Queue.poll return when the queue is empty?","Beginner",["p:It returns null. remove instead throws NoSuchElementException."]],["What does Queue.peek return when the queue is empty?","Beginner",["p:It returns null. element instead throws NoSuchElementException."]],["How do push and offerFirst differ on Deque?","Intermediate",["p:push is equivalent to addFirst and throws if insertion fails. offerFirst returns false when insertion cannot be accepted."]],["What does Deque.pop remove?","Beginner",["p:It removes and returns the first element, behaving like a stack pop; it throws NoSuchElementException when empty."]],["Can ArrayDeque contain null?","Beginner",["p:No. It rejects null elements, allowing null return values from poll/peek to unambiguously indicate emptiness."]],["Does ArrayDeque have a fixed capacity?","Intermediate",["p:No fixed user-visible capacity limit; it grows its backing array as needed, subject to memory and implementation limits."]],["How do you use one Deque as both stack and queue?","Beginner",["p:For stack behaviour use push/pop/peek at the front. For FIFO queue behaviour use offerLast/pollFirst/peekFirst."]],["What is the difference between addFirst and offerFirst?","Beginner",["p:addFirst throws an exception if insertion cannot be completed; offerFirst returns false. For an unbounded ArrayDeque, capacity failure is uncommon aside from resource limits."]]]},
{"t":"PriorityQueue and Heap Behaviour","qs":[["Does PriorityQueue.poll always return the smallest element?","Intermediate",["p:It returns the least element according to the queue's ordering. With the natural-order constructor, that is the smallest element."]],["Does PriorityQueue iteration return sorted order?","Beginner",["p:No. Its iterator traverses the internal heap representation, not a sorted sequence. Repeated poll calls produce priority order."]],["How do you create a max-priority queue of integers?","Beginner",["p:Use new PriorityQueue&lt;&gt;(Comparator.reverseOrder()). Its head is the greatest integer according to natural ordering."]],["What happens when PriorityQueue receives null?","Beginner",["p:It throws NullPointerException. Null elements are not permitted."]],["Can PriorityQueue contain duplicate elements?","Beginner",["p:Yes. Equal-priority elements can both be present; their relative poll order is not guaranteed to be stable."]],["What is the complexity of PriorityQueue.remove(Object)?","Intermediate",["p:O(n) because the queue must locate the matching element in the heap array before repairing the heap."]],["What is the complexity of PriorityQueue.peek?","Beginner",["p:O(1), because the head element is stored at the root of the heap."]],["What happens if a queued object's priority field changes?","Advanced",["p:The heap is not automatically reheapified. The element may appear in the wrong position; remove and reinsert it after changing priority."]],["How can you process the k smallest values from a large stream?","Advanced",["p:Maintain a max-heap of size k containing the current k smallest values. For each value, insert until full; then replace the head only when the new value is smaller. Complexity is O(n log k), with O(k) space."]],["What is the difference between PriorityQueue and PriorityBlockingQueue?","Intermediate",["p:PriorityQueue is not thread-safe. PriorityBlockingQueue is thread-safe and blocking-capable for take, but it is logically unbounded and does not block producers due to capacity."]]]},
{"t":"Iterators and ListIterator","qs":[["What does Iterator.next do when no elements remain?","Beginner",["p:It throws NoSuchElementException. Check hasNext before calling next."]],["Can Iterator.remove be called twice after one next?","Intermediate",["p:No. Calling remove twice for the same returned element, or before next, throws IllegalStateException."]],["Does ListIterator support adding elements during iteration?","Beginner",["p:Yes. ListIterator.add inserts an element at the iterator's current cursor position and updates its state."]],["What does ListIterator.set replace?","Intermediate",["p:It replaces the last element returned by next or previous. It is illegal before either method has been called or after an intervening add/remove."]],["Can an Iterator move backwards?","Beginner",["p:No. Use ListIterator for bidirectional traversal of a List."]],["What is the difference between iterator.remove and collection.remove?","Intermediate",["p:iterator.remove is designed to remove the last returned element while maintaining iterator state. Direct collection.remove during iteration can trigger fail-fast behaviour."]],["Can an iterator be reused after reaching the end?","Beginner",["p:No. Once exhausted, it remains exhausted. Obtain a new iterator to traverse the collection again."]],["Does enhanced for support removing the current item safely?","Intermediate",["p:Not by calling collection.remove inside the loop. Use an explicit Iterator and its remove method, or use removeIf."]],["How does Spliterator support parallel traversal?","Advanced",["p:It traverses elements and can split work into partitions. It supports characteristics such as ORDERED, SIZED, DISTINCT and IMMUTABLE, and underpins streams and parallel traversal."]],["What does Spliterator.trySplit return?","Advanced",["p:It returns another Spliterator covering a partition of elements, or null if it cannot split. The exact partition strategy is implementation-dependent."]]]},
{"t":"Fail-Fast and Concurrent Modification","qs":[["Is ConcurrentModificationException proof of multiple threads?","Beginner",["p:No. It commonly occurs in a single thread when code structurally modifies a collection outside the active iterator."]],["Is fail-fast behaviour guaranteed?","Intermediate",["p:No. It is best-effort bug detection. Programs must not depend on ConcurrentModificationException being thrown."]],["What is a structural modification to ArrayList?","Intermediate",["p:A change that alters its size or otherwise structurally changes the list, such as adding or removing elements. Replacing an element with set is not structural."]],["Does changing a HashMap value invalidate its iterator?","Intermediate",["p:Replacing the value for an existing key is not structural and normally does not invalidate the iterator. Adding or removing a mapping is structural."]],["Why can removing the last item in a for-each loop sometimes avoid CME?","Advanced",["p:Some iterator implementations detect modification in next rather than hasNext. If the loop terminates before another next call, the mismatch may not be observed. This is an implementation detail, not safe practice."]],["How does CopyOnWriteArrayList avoid iterator CME?","Intermediate",["p:Its iterators hold a snapshot of the backing array at iterator creation. They do not observe subsequent writes and do not support iterator removal."]],["What does weakly consistent iterator mean?","Advanced",["p:It can traverse concurrently modified data without throwing ConcurrentModificationException. It may reflect some updates made after iterator creation, but does not promise a fixed snapshot."]],["Can synchronizedList iteration be unsynchronized?","Intermediate",["p:No. The caller must synchronize on the returned list during iteration to prevent races and ensure the iteration is protected by the wrapper's mutex."]],["How do you remove all nulls from a modifiable list?","Beginner",["p:Use list.removeIf(Objects::isNull), or list.removeAll(Collections.singleton(null)). The list must support removal."]],["What is the safe approach when a callback may modify the collection being traversed?","Advanced",["p:Avoid modifying the active source during traversal. Iterate over a defensive copy, collect pending changes and apply them afterwards, or use a collection designed for concurrent modification."]]]},
{"t":"Collections Utility Methods","qs":[["What does Collections.frequency return?","Beginner",["p:It returns the number of elements equal to the specified object in the supplied collection."]],["What does Collections.disjoint determine?","Beginner",["p:It returns true when the two collections have no elements in common according to equality."]],["What is Collections.nCopies used for?","Intermediate",["p:It returns an immutable list containing n references to the same supplied object. It is a view-like repeated list, not n independent object copies."]],["Can Collections.fill change the size of a list?","Beginner",["p:No. It replaces every existing element with the supplied value; the list size remains unchanged."]],["How does rotating a List change its element positions?","Beginner",["p:It rotates elements by a distance, moving elements from the end to the front for positive distances. The list size is unchanged."]],["What does Collections.swap require?","Beginner",["p:It exchanges the elements at two valid indices. Invalid indices cause IndexOutOfBoundsException."]],["What must be true before Collections.binarySearch is used?","Intermediate",["p:The list must be sorted according to the same ordering used by the search, otherwise the result is undefined."]],["How is binarySearch's negative result decoded?","Intermediate",["p:If not found, it returns -(insertionPoint)-1. Recover the insertion point with -result-1."]],["What does Collections.checkedList protect against?","Advanced",["p:It creates a dynamically type-checked view that checks inserted elements at runtime, helping detect heap pollution through raw-type references."]],["Does Collections.unmodifiableCollection make the backing collection immutable?","Intermediate",["p:No. It prevents modification through the wrapper but reflects changes made through other references to the backing collection."]]]},
{"t":"Immutable and Fixed-Size Collections","qs":[["Can Arrays.asList be resized?","Beginner",["p:No. Its size is fixed to the array length. set is supported and writes through to the array, but add and remove throw UnsupportedOperationException."]],["Are elements of List.of deeply immutable?","Intermediate",["p:No. The list structure is unmodifiable, but mutable element objects can still be changed through other references."]],["Does List.copyOf create a defensive unmodifiable copy?","Intermediate",["p:It returns an unmodifiable list containing the source elements and rejects nulls. Implementations may reuse an already suitable immutable instance."]],["Can List.of contain null?","Beginner",["p:No. Supplying null causes NullPointerException."]],["What happens when Set.of receives duplicate values?","Beginner",["p:It throws IllegalArgumentException because a Set factory cannot create a set with duplicate elements."]],["What happens when Map.of receives a duplicate key?","Beginner",["p:It throws IllegalArgumentException. Each key must be unique."]],["Can Collections.singletonList be modified with set?","Intermediate",["p:No. It is an unmodifiable singleton list; attempts to modify it throw UnsupportedOperationException."]],["Is Collections.emptyList mutable?","Beginner",["p:No. It is an immutable empty list; mutation attempts throw UnsupportedOperationException."]],["What is the difference between unmodifiableList and List.copyOf?","Advanced",["p:unmodifiableList wraps a backing list and reflects external changes. List.copyOf produces an unmodifiable result that is not a live view of later source changes; it also rejects null elements."]],["Can an unmodifiable view be used to observe changes?","Intermediate",["p:Yes. If another reference modifies the backing collection, the unmodifiable view reflects those changes while still blocking writes through the view."]]]},
{"t":"Generics and Collections","qs":[["Why is List&lt;Integer&gt; not a subtype of List&lt;Number&gt;?","Intermediate",["p:Java generics are invariant. If it were allowed, code could add a Double to a List&lt;Integer&gt; through a List&lt;Number&gt; reference."]],["What can be added to List&lt;?&gt;?","Beginner",["p:Only null can be added because the element type is unknown. Values can be read as Object."]],["What can be read from List&lt;? extends Number&gt;?","Beginner",["p:Elements can safely be read as Number, but arbitrary Number subtypes cannot be added because the exact captured subtype is unknown."]],["What can be added to List&lt;? super Integer&gt;?","Intermediate",["p:Integer values and its subtypes can be added. Values read from it are typed as Object because the actual element type may be Number or Object."]],["What does PECS stand for?","Beginner",["p:Producer Extends, Consumer Super. Use extends when a parameter supplies T values and super when it consumes T values."]],["Why are generic arrays not directly creatable?","Advanced",["p:Arrays retain runtime component types and are covariant, while generic type arguments are erased. A generic array could allow heap pollution that the runtime array store check cannot detect safely."]],["What is a bounded type parameter?","Intermediate",["p:A declaration such as &lt;T extends Number&gt; restricts T to Number or its subclasses and permits the method or class to use Number's API."]],["Can a generic method declare its own type parameter?","Beginner",["p:Yes. For example, static &lt;T&gt; T first(List&lt;T&gt; values) declares a method-level type parameter independent of any enclosing class parameter."]],["What is a raw collection type?","Intermediate",["p:A generic type used without its type argument, such as List instead of List&lt;String&gt;. It bypasses compile-time generic checks and can cause ClassCastException later."]],["What is heap pollution in a generic collection?","Advanced",["p:It occurs when a variable of a parameterized type refers to a collection containing an element that is not of the declared type, often through raw types or unchecked operations."]]]},
{"t":"Sorting and Comparators","qs":[["What must Comparator.compare return?","Beginner",["p:A negative integer, zero or a positive integer indicating whether the first argument is less than, equal to or greater than the second under that ordering."]],["Can a comparator return only -1 or 1?","Intermediate",["p:It can for a valid strict ordering of distinct values, but it must return zero for values considered equal and must satisfy comparator consistency and transitivity."]],["Why should comparator subtraction be avoided?","Advanced",["p:Subtraction can overflow and produce an incorrect sign. Use Integer.compare, Long.compare or Comparator.comparingInt instead."]],["How do you sort strings case-insensitively?","Beginner",["p:Use list.sort(String.CASE_INSENSITIVE_ORDER) or Comparator.comparing with an appropriate normalized key."]],["How do you sort null values last?","Intermediate",["p:Use Comparator.nullsLast(Comparator.naturalOrder()) for the relevant nullable field or value."]],["What does thenComparing do?","Beginner",["p:It adds a secondary comparison that is used only when the preceding comparator considers the two objects equal."]],["What does Comparator.comparingInt avoid?","Intermediate",["p:It avoids boxing an int key into Integer during comparisons, unlike a generic comparing extractor that produces boxed values."]],["Is object sorting stable in Java?","Intermediate",["p:The standard object sorting methods such as List.sort and Arrays.sort(Object[]) are stable, so equal elements retain their relative order."]],["What happens if a comparator violates transitivity?","Advanced",["p:The ordering contract is broken. Sorting may produce unpredictable results or throw IllegalArgumentException when the implementation detects a contract violation."]],["How do you reverse a comparator?","Beginner",["p:Call comparator.reversed(). Be aware that reversing a composed comparator reverses the whole ordering built so far."]]]},
{"t":"Concurrent Collections","qs":[["Why does ConcurrentHashMap reject null keys and values?","Intermediate",["p:Null is reserved to indicate absence in operations such as get, enabling unambiguous concurrent retrieval semantics."]],["Does ConcurrentHashMap allow concurrent reads and writes?","Beginner",["p:Yes. It is designed for concurrent access, providing thread-safe operations and high concurrency without locking the entire map for every operation."]],["Is ConcurrentHashMap.size always an exact snapshot?","Advanced",["p:During concurrent updates, size is a transient estimate rather than an atomic snapshot of all mappings. Use it for monitoring or control with care."]],["What does ConcurrentHashMap.computeIfAbsent provide?","Intermediate",["p:It performs the mapping operation atomically for a key when no non-null mapping exists. The mapping function should be short and must not recursively update the same map."]],["Can ConcurrentHashMap iterators throw CME?","Beginner",["p:Its iterators are weakly consistent and do not throw ConcurrentModificationException due to concurrent map updates."]],["What is CopyOnWriteArrayList best suited for?","Intermediate",["p:Read-mostly workloads with relatively few writes, such as listener registries. Each write copies the backing array, making frequent writes expensive."]],["Does CopyOnWriteArrayList iterator see additions made later?","Beginner",["p:No. An iterator traverses the snapshot captured when it was created and does not see later additions."]],["What is ConcurrentLinkedQueue?","Intermediate",["p:An unbounded, thread-safe, non-blocking FIFO queue based on linked nodes. It does not provide blocking take/put operations."]],["What is the difference between ConcurrentLinkedQueue and LinkedBlockingQueue?","Intermediate",["p:ConcurrentLinkedQueue is non-blocking and unbounded. LinkedBlockingQueue supports blocking put/take and can be bounded by a supplied capacity."]],["Which concurrent collection is suitable for a sorted concurrent set?","Beginner",["p:ConcurrentSkipListSet provides a sorted, navigable, concurrent set with expected logarithmic operations."]]]},
{"t":"Blocking Queues and Producer Consumer","qs":[["What does BlockingQueue.take do when empty?","Beginner",["p:It waits until an element becomes available, then removes and returns the head element."]],["What does BlockingQueue.put do when full?","Beginner",["p:It waits until space becomes available and then inserts the element."]],["How does offer(element, timeout, unit) behave?","Intermediate",["p:It waits up to the specified time for capacity, then returns true if inserted or false if the timeout expires."]],["What is a poison pill in producer-consumer design?","Intermediate",["p:It is a special sentinel item placed in the queue to tell consumers to stop. The protocol must ensure enough sentinels are sent for all consumers."]],["Why prefer bounded queues in services?","Intermediate",["p:They limit memory growth and provide back-pressure when producers outpace consumers. A rejection or throttling policy should define what happens at capacity."]],["What is SynchronousQueue?","Advanced",["p:It has no internal capacity; each insertion must rendezvous directly with a consumer taking the item. It is useful for direct handoff."]],["Does PriorityBlockingQueue block producers when full?","Intermediate",["p:No. It is logically unbounded, so put does not wait for capacity. Memory can still be exhausted if producers overwhelm consumers."]],["What is DelayQueue used for?","Intermediate",["p:It holds Delayed elements and makes an element available for retrieval only after its delay has expired."]],["What is ArrayBlockingQueue fairness?","Advanced",["p:Its optional fairness setting controls FIFO ordering among waiting producer and consumer threads for access to the queue lock; fairness can reduce throughput."]],["How do you shut down a producer-consumer pipeline safely?","Advanced",["p:Stop accepting new work, signal consumers using interruption or a defined sentinel protocol, drain or cancel outstanding tasks according to policy, and join worker threads."]]]},
{"t":"Specialized Collections","qs":[["When should EnumMap be preferred?","Beginner",["p:When keys are values of a single enum type. It uses an efficient array representation and iterates in enum declaration order."]],["Can EnumMap contain a null key?","Beginner",["p:No. It rejects null keys, though null values are permitted."]],["What is EnumSet internally optimized for?","Intermediate",["p:It represents enum constants as bit vectors, making set operations such as union and intersection very efficient."]],["What does IdentityHashMap use for key equality?","Intermediate",["p:Reference identity (==) rather than logical equality (equals). It is intended for specialized identity-based tasks, not ordinary Map usage."]],["What is WeakHashMap's key-reference behaviour?","Intermediate",["p:It holds keys through weak references, allowing entries to disappear after keys are no longer strongly reachable elsewhere."]],["Can a WeakHashMap value keep its key alive?","Advanced",["p:Yes. If a value strongly references its own key, the map's value-to-key reference can prevent collection of that key, defeating the expected weak-key cleanup."]],["What is an IdentityHashMap useful for?","Advanced",["p:It is useful in object graph traversal, serialization and deep-copy algorithms where distinct objects that are equals-equal must remain distinct."]],["What is a BitSet?","Beginner",["p:A compact mutable sequence of bits with operations such as set, clear, get, and, or and cardinality. It is not a Collection implementation."]],["What is Properties in the collections ecosystem?","Intermediate",["p:Properties extends Hashtable&lt;Object,Object&gt; but is intended for string-based configuration properties. Its string-specific methods include getProperty and setProperty."]],["What is a WeakHashMap commonly used for?","Intermediate",["p:It can support auxiliary metadata or caches whose entries should not keep key objects alive. It is not a deterministic eviction cache."]]]},
{"t":"Views, Copies and Backing Data","qs":[["Is Map.keySet a snapshot?","Beginner",["p:No. It is a live view backed by the map. Changes to the map are reflected in the view and removals through the view affect the map."]],["Can you add an element to map.values()?","Intermediate",["p:No. The values view supports removal and clearing but does not support adding values because a value alone does not specify a key."]],["Does subList create an independent list?","Beginner",["p:No. It is a backed view of a range. Changes can affect the parent list and structural changes to the parent outside the view can invalidate it."]],["How do you create an independent subList copy?","Beginner",["p:Use new ArrayList&lt;&gt;(list.subList(from,to)). This creates a new list containing the selected element references."]],["What is a shallow copy of a collection?","Beginner",["p:A new collection object is created, but the element references are copied rather than cloning the elements."]],["What is a deep copy?","Intermediate",["p:A new collection and independent copies of its contained mutable objects are created. The required depth and copying strategy depend on the object graph."]],["Does Collections.unmodifiableMap prevent changes through the original map?","Beginner",["p:No. It blocks mutation through the wrapper only. Mutations through another reference to the backing map remain visible."]],["What is the difference between clone and copy constructor for a collection?","Advanced",["p:Both commonly make shallow copies, but clone is a legacy Object method with implementation-specific behaviour; a copy constructor clearly expresses the desired target type and copy semantics."]],["Does Arrays.asList reflect changes to its source array?","Beginner",["p:Yes. It is backed by the array, so changing an array slot or calling list.set changes the same underlying storage."]],["Can List.copyOf be used to freeze a changing source list?","Intermediate",["p:It creates an unmodifiable result independent of later structural changes to the source. The element objects themselves are not deeply copied."]]]},
{"t":"Streams and Collection Interoperability","qs":[["What does Collection.stream return?","Beginner",["p:It returns a sequential Stream over the collection's elements. The stream is generally lazy until a terminal operation is invoked."]],["What does parallelStream change?","Intermediate",["p:It requests a parallel stream whose pipeline may process elements concurrently using a fork-join pool. Parallel execution is not automatically faster."]],["What is the difference between stream().toList and collect(toList)?","Advanced",["p:Stream.toList returns an unmodifiable list. Collectors.toList does not guarantee a specific implementation or mutability, even though common implementations return a modifiable ArrayList."]],["How do you collect stream elements into a TreeSet?","Beginner",["p:Use collect(Collectors.toCollection(TreeSet::new)). This creates a sorted set and removes comparator-equal duplicates."]],["What happens when Collectors.toMap encounters duplicate keys?","Intermediate",["p:The two-argument toMap collector throws IllegalStateException. Supply a merge function to resolve duplicate keys."]],["How do you preserve encounter order when collecting to a Map?","Intermediate",["p:Use Collectors.toMap with LinkedHashMap::new as the map supplier, assuming the source stream has a meaningful encounter order."]],["What does groupingBy return by default?","Beginner",["p:It returns a Map whose values are lists of elements grouped by classifier result; the default map implementation is not part of the general API guarantee."]],["What is partitioningBy?","Intermediate",["p:It groups stream elements into two Boolean-keyed buckets based on a predicate, for true and false."]],["Why is mutating an ArrayList inside parallel forEach unsafe?","Advanced",["p:Multiple worker threads can concurrently mutate a non-thread-safe list, causing lost updates, corruption or exceptions. Use a collector or a concurrent collection."]],["What is the difference between distinct and collecting into a Set?","Intermediate",["p:distinct is a stream intermediate operation that removes duplicates according to equals while preserving encounter order for ordered streams. A Set collector uses the target set's equality/order semantics."]]]},
{"t":"Java Version and Sequenced Collections","qs":[["In which Java version were List.of and Set.of introduced?","Beginner",["p:Java 9 introduced the collection factory methods List.of, Set.of and Map.of."]],["When was List.copyOf introduced?","Beginner",["p:Java 10 introduced copyOf factory methods for List, Set and Map."]],["Which Java version introduced SequencedCollection?","Beginner",["p:Java 21 introduced SequencedCollection, SequencedSet and SequencedMap to standardize APIs for collections with encounter order."]],["What does SequencedCollection.reversed return?","Intermediate",["p:It returns a reverse-ordered view of the collection, not necessarily a new independent copy."]],["Which common collections implement SequencedCollection?","Intermediate",["p:List and Deque implement SequencedCollection; LinkedHashSet implements SequencedSet. Sorted sets also have defined encounter order through their sorted nature."]],["What are getFirst and getLast used for?","Beginner",["p:They access the first and last elements of a sequenced collection. Empty-collection behaviour follows the interface contract and can throw NoSuchElementException."]],["What does SequencedMap.putFirst do?","Advanced",["p:It places a mapping at the beginning of the map's encounter order when supported by that map implementation."]],["Does HashSet implement SequencedSet?","Beginner",["p:No. HashSet has no defined encounter order. LinkedHashSet is the insertion-ordered set implementation."]],["Does TreeSet have a defined encounter order?","Intermediate",["p:Yes. It iterates in comparator-sorted order and implements the sorted/navigable set contracts; it participates in the sequenced collection hierarchy in modern Java."]],["Why check the target Java version before using collection APIs?","Beginner",["p:Methods and interfaces are added in particular releases. Compiling against a newer JDK does not make those APIs available on an older runtime."]]]},
{"t":"Performance, Capacity and Complexity","qs":[["Why presize a HashSet for a known number of elements?","Intermediate",["p:It can reduce resizing and rehashing as elements are inserted. Choose capacity with the load factor in mind rather than assuming the expected element count is the raw table capacity."]],["What is the load factor in a hash-based collection?","Beginner",["p:It is the ratio used to determine when a hash table should resize relative to its bucket capacity. A lower factor reduces average collisions but uses more memory."]],["Why can HashMap iteration be slow after heavy over-allocation?","Advanced",["p:Iteration may scan the bucket table as well as entries. An unnecessarily large capacity can therefore increase iteration cost even when the map contains few entries."]],["What is amortized O(1) append in ArrayList?","Intermediate",["p:Most appends take constant time; occasional growth copies the backing array in O(n). Averaged across many appends, the cost per append remains constant."]],["Why is ArrayDeque often preferred over LinkedList for queue use?","Intermediate",["p:It generally has lower per-element memory overhead and better locality because it stores references in a resizable array, while supporting efficient operations at both ends."]],["What is the cost of contains on ArrayList?","Beginner",["p:O(n) worst case because it performs a linear search."]],["What is the cost of contains on HashSet?","Beginner",["p:Expected O(1) with well-distributed hashes, but collisions and poor hash functions can degrade performance."]],["What is the cost of TreeSet add?","Beginner",["p:O(log n), because the set is backed by a balanced search tree."]],["Why can LinkedList indexed loops become O(n squared)?","Intermediate",["p:Each get(i) requires traversal. Calling get for every index repeats traversal work; use an iterator or enhanced for loop for linear traversal."]],["What tool should be used for reliable JVM microbenchmarks?","Advanced",["p:Use JMH rather than ad hoc System.nanoTime loops. JMH helps control warmup, dead-code elimination, JIT compilation and measurement noise."]]]},
{"t":"Output Prediction: List and Set Traps","qs":[["Predict: List&lt;Integer&gt; x=new ArrayList&lt;&gt;(List.of(1,2,3)); x.remove(1); System.out.println(x);","Intermediate",["p:Output: [1, 3]. The int argument selects remove(int index), so the element at index 1 is removed."]],["Predict: List&lt;Integer&gt; x=new ArrayList&lt;&gt;(List.of(1,2,3)); x.remove(Integer.valueOf(1)); System.out.println(x);","Intermediate",["p:Output: [2, 3]. Passing an Integer selects remove(Object), removing the matching value 1."]],["Predict: List&lt;String&gt; x=Arrays.asList(\"a\",\"b\"); x.set(0,\"z\"); System.out.println(x);","Beginner",["p:Output: [z, b]. Arrays.asList is fixed-size but supports set."]],["Predict: List&lt;String&gt; x=List.of(\"a\",\"b\"); x.set(0,\"z\");","Beginner",["p:It throws UnsupportedOperationException because List.of creates an unmodifiable list."]],["Predict: Set&lt;Integer&gt; s=new HashSet&lt;&gt;(); s.add(1); s.add(1); System.out.println(s.size());","Beginner",["p:Output: 1. A Set does not retain duplicate equal elements."]],["Predict: Set&lt;Integer&gt; s=new LinkedHashSet&lt;&gt;(); s.add(3); s.add(1); s.add(3); System.out.println(s);","Intermediate",["p:Output: [3, 1]. LinkedHashSet preserves insertion order and ignores the second insertion of 3."]],["Predict: Set&lt;String&gt; s=new TreeSet&lt;&gt;(Comparator.comparingInt(String::length)); s.add(\"cat\"); s.add(\"dog\"); System.out.println(s.size());","Advanced",["p:Output: 1. The comparator returns zero for both three-character strings, so TreeSet treats them as the same set element."]],["Predict: List&lt;Integer&gt; x=new ArrayList&lt;&gt;(List.of(1,2)); List&lt;Integer&gt; y=x.subList(0,1); y.clear(); System.out.println(x);","Intermediate",["p:Output: [2]. subList is a backed view, so clearing it removes the corresponding element from the parent list."]],["Predict: List&lt;String&gt; x=new ArrayList&lt;&gt;(List.of(\"a\",\"b\")); List&lt;String&gt; y=Collections.unmodifiableList(x); x.add(\"c\"); System.out.println(y);","Intermediate",["p:Output: [a, b, c]. The wrapper blocks writes through y but reflects changes to x."]],["Predict: List&lt;String&gt; x=new ArrayList&lt;&gt;(List.of(\"a\",\"b\")); System.out.println(x.indexOf(\"z\"));","Beginner",["p:Output: -1. indexOf returns -1 when no equal element is found."]]]},
{"t":"Output Prediction: Queue, Map and Miscellaneous","qs":[["Predict: Queue&lt;Integer&gt; q=new ArrayDeque&lt;&gt;(); System.out.println(q.poll());","Beginner",["p:Output: null. poll returns null when the queue is empty."]],["Predict: Queue&lt;Integer&gt; q=new ArrayDeque&lt;&gt;(); q.add(4); q.add(7); System.out.println(q.remove()+\" \"+q.peek());","Intermediate",["p:Output: 4 7. remove retrieves the head; peek observes the next head without removing it."]],["Predict: Deque&lt;Integer&gt; d=new ArrayDeque&lt;&gt;(); d.push(1); d.push(2); System.out.println(d.pop());","Beginner",["p:Output: 2. push inserts at the front and pop removes from the front, giving LIFO behaviour."]],["Predict: PriorityQueue&lt;Integer&gt; q=new PriorityQueue&lt;&gt;(); q.addAll(List.of(5,1,3)); System.out.println(q.poll());","Beginner",["p:Output: 1. The default PriorityQueue uses natural ascending order, so the least element is polled first."]],["Predict: PriorityQueue&lt;Integer&gt; q=new PriorityQueue&lt;&gt;(); q.addAll(List.of(5,1,3)); System.out.println(q.peek());","Beginner",["p:Output: 1. peek returns the least element without removing it."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); m.put(\"b\",2); m.values().clear(); System.out.println(m.isEmpty());","Intermediate",["p:Output: true. The values collection is a live view; clearing it clears the map."]],["Predict: Map&lt;String,Integer&gt; m=new HashMap&lt;&gt;(); m.put(\"a\",1); System.out.println(m.entrySet().iterator().next().getKey());","Beginner",["p:Output: a. There is only one entry, so its key is a regardless of HashMap iteration order."]],["Predict: Map&lt;String,Integer&gt; m=new TreeMap&lt;&gt;(); m.put(\"b\",2); m.put(\"a\",1); System.out.println(m.keySet());","Beginner",["p:Output: [a, b]. TreeMap iterates keys in sorted natural order."]],["Predict: List&lt;Integer&gt; a=new ArrayList&lt;&gt;(List.of(1,2)); List&lt;Integer&gt; b=new ArrayList&lt;&gt;(List.of(2,3)); a.retainAll(b); System.out.println(a);","Intermediate",["p:Output: [2]. retainAll keeps only elements also present in b."]],["Predict: List&lt;Integer&gt; a=new ArrayList&lt;&gt;(List.of(1,2,2,3)); a.removeIf(v-&gt;v==2); System.out.println(a);","Intermediate",["p:Output: [1, 3]. removeIf removes every element matching the predicate."]]]},
{"t":"Coding Patterns: Frequency, Grouping and Deduplication","qs":[["How do you count element frequencies without streams?","Beginner",["p:Use a Map&lt;T,Integer&gt; and call map.merge(element,1,Integer::sum) for each element. This gives expected O(n) time with a hash map."]],["How do you find the first non-repeating character?","Intermediate",["p:Count characters in a LinkedHashMap to preserve first-seen order, then scan its entries for the first count equal to one."]],["How do you find duplicates while preserving their first duplicate encounter order?","Intermediate",["p:Maintain a seen HashSet and a duplicate LinkedHashSet. Add to duplicates when seen.add(value) returns false."]],["How do you remove duplicates while preserving order?","Beginner",["p:Create a new LinkedHashSet from the source and then, if a List is required, create an ArrayList from that set."]],["How do you merge two maps by summing values for equal keys?","Intermediate",["p:Copy the first map, then call merge(key,value,Integer::sum) for every entry in the second map."]],["How do you invert a map when values may repeat?","Intermediate",["p:Build Map&lt;V,List&lt;K&gt;&gt; and use computeIfAbsent(value, k -&gt; new ArrayList&lt;&gt;()).add(key) for each entry."]],["How do you group employees by department?","Beginner",["p:Use stream().collect(Collectors.groupingBy(Employee::getDepartment)), or populate a map of lists with computeIfAbsent in a loop."]],["How do you find the top k frequent elements?","Advanced",["p:Count frequencies in a HashMap and maintain a heap of size k. This takes O(n log k) after counting, with O(u+k) space for u unique values."]],["How do you compare two collections as multisets?","Advanced",["p:Build frequency maps for both collections and compare the maps. Set equality alone ignores duplicate counts."]],["How do you find the intersection while preserving the first list's order and duplicates?","Advanced",["p:Build a frequency map from the second list, then scan the first list and emit an element while its remaining count is positive, decrementing the count each time."]]]},
