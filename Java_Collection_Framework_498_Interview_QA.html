{"t":"Coding Patterns: Map and Collection APIs","qs":[["How do you safely initialize a list value in a Map?","Beginner",["p:Use map.computeIfAbsent(key, k -&gt; new ArrayList&lt;&gt;()).add(value). This creates the list only when the key has no non-null mapping."]],["How do you increment a counter in a Map in one expression?","Beginner",["p:Use counts.merge(key, 1, Integer::sum). It inserts 1 when absent and adds 1 when present."]],["How do you remove map entries whose values are null?","Intermediate",["p:Use map.entrySet().removeIf(e -&gt; e.getValue() == null). This removes the corresponding mappings through the live entry-set view."]],["How do you sort a list of map entries by value descending?","Intermediate",["p:Use entries.sort(Map.Entry.&lt;K,V&gt;comparingByValue(Comparator.reverseOrder())) when V is comparable, with an appropriate tie-breaker if deterministic order is needed."]],["How do you create a map from a list while keeping the first duplicate key?","Intermediate",["p:Use Collectors.toMap(keyMapper,valueMapper,(first,ignored)-&gt;first) or an explicit putIfAbsent loop."]],["How do you create a map from a list while keeping the last duplicate key?","Intermediate",["p:Use Collectors.toMap(keyMapper,valueMapper,(oldValue,newValue)-&gt;newValue) or ordinary HashMap.put in encounter order."]],["How do you safely get a mutable list from an immutable factory list?","Beginner",["p:Wrap it with new ArrayList&lt;&gt;(List.of(...)) to create a modifiable list."]],["How do you obtain a read-only snapshot of a collection?","Intermediate",["p:Use List.copyOf, Set.copyOf or Map.copyOf for an unmodifiable copy of the collection structure. These reject nulls and are shallow."]],["How do you process a Map without repeatedly looking up each value?","Beginner",["p:Iterate over entrySet and use each Map.Entry's key and value directly. This avoids separate key lookup operations."]],["How do you remove a mapping only if its value matches?","Intermediate",["p:Use map.remove(key, expectedValue), which performs a conditional removal and returns whether it succeeded."]]]},
{"t":"Common Exceptions and Debugging","qs":[["When does UnsupportedOperationException occur in collection code?","Beginner",["p:It occurs when an optional mutating operation is invoked on a collection or view that does not support it, such as add on Arrays.asList or List.of."]],["When does ClassCastException occur in TreeSet?","Intermediate",["p:It can occur when elements cannot be compared with each other using natural ordering or the supplied comparator."]],["When does NullPointerException occur in TreeMap?","Beginner",["p:A TreeMap using natural ordering rejects a null key. A comparator may have its own null-handling policy."]],["What causes ArrayIndexOutOfBoundsException in collection-adjacent code?","Intermediate",["p:It can result from indexing an array outside its valid range, including incorrect manual use of an ArrayList's internal assumptions; ordinary ArrayList invalid indices throw IndexOutOfBoundsException."]],["Why might HashMap.get unexpectedly return null?","Intermediate",["p:The key may be absent, mapped to null, or not found because its hash/equality-relevant state changed after insertion. Check containsKey and verify key contracts."]],["What does NoSuchElementException usually indicate in collection code?","Beginner",["p:A method requiring an element was called on an empty collection, such as Iterator.next, Queue.remove, Deque.getFirst or TreeMap.firstKey."]],["How do you debug unexpected duplicate keys in a HashMap?","Advanced",["p:Inspect equals and hashCode implementations, mutability of key fields, and whether keys that should be equal actually compare equal. Add contract tests for symmetry, transitivity and equal hash codes."]],["How do you investigate a collection-related memory leak?","Advanced",["p:Capture a heap dump, identify large retained collections and their GC roots, then inspect unbounded caches, static references, listener registrations, queues and long-lived views."]],["Why can a collection operation appear to lose data under concurrency?","Advanced",["p:Most standard mutable collections are not thread-safe. Concurrent writes can race, overwrite each other or expose inconsistent state. Use appropriate concurrent collections or synchronization."]],["What should be checked when a collection algorithm is unexpectedly slow?","Advanced",["p:Check algorithmic complexity, repeated linear contains/get calls, linked-list indexed access, poor hash distribution, unnecessary resizing, boxing, allocation and contention. Benchmark with representative data."]]]},
{"t":"Design Choices and Best Practices","qs":[["What is the default List implementation choice for most application code?","Beginner",["p:ArrayList is usually the default because it offers constant-time indexed access, amortized constant-time append and good memory locality."]],["When is TreeSet a better choice than HashSet?","Intermediate",["p:When sorted iteration, range views or nearest-element navigation such as floor and ceiling are required."]],["When is LinkedHashMap a better choice than HashMap?","Beginner",["p:When predictable insertion-order iteration or access-order behaviour is needed."]],["When should EnumSet replace HashSet?","Intermediate",["p:When the set's elements are constants of one enum type. EnumSet is compact and efficient for enum membership operations."]],["When should a BlockingQueue be used instead of a normal Queue?","Intermediate",["p:When producer and consumer threads need built-in waiting semantics for empty and full conditions, such as a worker pipeline."]],["Why should collection fields often be declared using interfaces?","Intermediate",["p:Declaring fields as List, Set or Map reduces coupling to one implementation and makes it easier to change implementations or substitute test doubles."]],["Why avoid exposing an internal mutable collection from a class?","Beginner",["p:Callers can modify internal state unexpectedly. Return an unmodifiable view or defensive copy and control mutations through methods."]],["Should a HashMap be used when deterministic iteration order is required?","Beginner",["p:No. Choose LinkedHashMap for insertion/access order or TreeMap for comparator-sorted keys."]],["Why should collection keys generally be immutable?","Intermediate",["p:Immutability keeps hashCode and equals stable while the key is stored, preserving reliable lookup and removal."]],["What is the most important collection selection principle?","Beginner",["p:Choose based on required semantics first—ordering, uniqueness, key lookup, priority, concurrency and null policy—then evaluate complexity and measured performance."]]]},
{"t":"Advanced Edge Cases and Interview Scenarios","qs":[["Can a map contain two keys that are equals-equal but have different hash codes?","Advanced",["p:A correctly implemented key type must not do this. If it violates the equals/hashCode contract, HashMap may store both because they can be placed in different buckets."]],["Can a TreeMap contain keys that are not equals-equal but compare as zero?","Advanced",["p:Yes, but TreeMap treats them as the same key for map operations. The second insertion replaces the value associated with the comparator-equivalent key."]],["What happens when a comparator is inconsistent with equals in a HashSet?","Advanced",["p:HashSet does not use a comparator; it uses hashCode and equals. Comparator inconsistency matters for sorted sets and maps, not HashSet."]],["Why is Collections.synchronizedMap not enough to make a compound operation atomic?","Advanced",["p:The wrapper synchronizes individual method calls, not an arbitrary sequence. Synchronize on the map around check-then-act logic or use atomic methods from a concurrent map."]],["Why can a synchronized collection still fail during iteration?","Intermediate",["p:Iteration spans multiple method calls. Without holding the wrapper's mutex for the entire traversal, another thread can modify the collection between iterator operations."]],["What is the difference between atomicity and thread safety in map operations?","Advanced",["p:Thread safety ensures internal operations can be used concurrently according to the contract. Atomicity means a particular operation or compound state transition occurs indivisibly; separate calls do not automatically form one atomic transaction."]],["Why is returning a live view from an API sometimes dangerous?","Advanced",["p:Callers can observe concurrent changes, invalidate iterators or mutate the backing data through supported removal operations. Document view semantics or return a defensive snapshot."]],["Can a stream safely operate while its source collection is modified?","Advanced",["p:Generally, do not modify a non-concurrent source during stream execution. Such interference can cause unpredictable results or exceptions; use a snapshot or a properly designed concurrent source."]],["Why is a comparator that depends on mutable object fields risky in TreeSet?","Advanced",["p:Changing fields used for comparison while an element is stored can invalidate the tree's ordering invariants, making searches and removals unreliable."]],["How would you choose a collection for a leaderboard?","Expert",["p:For a continuously sorted ranking, use a navigable structure with a comparator and a stable tie-breaker, or a priority queue for top-k extraction. Consider update frequency, range queries, concurrency and duplicate scores."]]]}
];
const TITLE="Java Collection Framework";
/* ---------- BUILD ---------- */
const H=600;let pages=[],cur=null,qn=0,chStart=[];
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const MEAS=el('div','');MEAS.style.cssText='position:absolute;left:-10000px;top:0;visibility:hidden';document.body.appendChild(MEAS);
function newPage(){const p=el('div','page');MEAS.appendChild(p);p.appendChild(el('div','body'));p.appendChild(el('div','foot'));pages.push(p);return p}
function add(b,keep){let body=cur.firstChild;body.appendChild(b);
 if(body.scrollHeight>body.clientHeight+1){body.removeChild(b);let carry=[];
  const last=body.lastChild;if(last&&last.dataset.keep){body.removeChild(last);carry.push(last)}
  cur=newPage();carry.forEach(x=>cur.firstChild.appendChild(x));cur.firstChild.appendChild(b)}
 if(keep)b.dataset.keep=1}
function breakPage(){cur=newPage()}
/* cover */
const cover=el('div','page cover',`<div class="badge">JCF</div><h1>${TITLE}</h1><h2>Interview Reference Book<br>Beginner to Expert · Java 8 – 25</h2><div style="font-size:13px;color:#c9bb97">Volume 1 – Questions 1–${CH.reduce((s,c)=>s+c.qs.length,0)}</div>`);
pages.push(cover);
/* TOC pages (paginated) */
cur=newPage();cur.firstChild.appendChild(el('h3','ch','Table of Contents'));const tocLinks=[];
CH.forEach((c,i)=>{const w=el('div','toc',`<a data-ch="${i}"><span>${i+1}. ${c.t}</span><span class="pg"></span></a>`);add(w);tocLinks.push(w.firstChild)});
/* chapters */
CH.forEach((c,ci)=>{cur=newPage();chStart[ci]=pages.length-1;
 const h=el('div','',`<div class="chno">Chapter ${ci+1}</div><h3 class="ch">${c.t}</h3>`);cur.firstChild.appendChild(h);
 c.qs.forEach(([q,lvl,ans])=>{qn++;add(el('div','q',`<span class="n">Q${qn}</span>${q}<em>${lvl}</em>`),true);
  ans.forEach(x=>{const k=x.slice(0,2),v=x.slice(2);let b;
   if(k==='c:')b=el('pre','',v);else if(k==='l:')b=el('div','a','<ul>'+v.split('|').map(i=>'<li>'+i+'</li>').join('')+'</ul>');else b=el('div','a',v);
   add(b);const prev=b.previousSibling;if(prev&&prev.dataset&&prev.dataset.keep)delete prev.dataset.keep})})});
/* end page */
cur=newPage();cur.firstChild.innerHTML='<h3 class="ch">End of Volume 1</h3><p>Questions 1–'+qn+' are covered in this volume. Use <b>Contents</b> to jump to any chapter.</p>';
while(pages.length%2===0)pages.push(el('div','page empty'));
pages.forEach((p,i)=>{const f=p.querySelector('.foot');if(f&&i>0)f.textContent=i+' · '+TITLE});
CH.forEach((c,i)=>{tocLinks[i].dataset.p=chStart[i];tocLinks[i].querySelector('.pg').textContent=chStart[i]});
MEAS.remove();
/* ---------- VIEW ---------- */
const N=pages.length,S=(N-1)/2;let s=0;
const L=document.getElementById('L'),R=document.getElementById('R'),ind=document.getElementById('ind');
function show(x){s=Math.max(0,Math.min(S,x));L.innerHTML='';R.innerHTML='';
 const l=pages[2*s-1],r=pages[2*s];
 L.appendChild(l?l.cloneNode(true):el('div','page empty'));R.appendChild(r.cloneNode(true));
 ind.textContent=s===0?'Cover':`Pages ${2*s-1}–${2*s} of ${N-1}`;
 bF.disabled=bP.disabled=s===0;bN.disabled=bL.disabled=s===S}
function go(x,dir){x=Math.max(0,Math.min(S,x));if(x===s)return;
 dir=dir||(x>s?1:-1);const src=dir>0?pages[2*s]:pages[2*s-1];
 const leaf=el('div','leaf '+(dir>0?'n':'p'));leaf.appendChild(src.cloneNode(true));document.getElementById('book').appendChild(leaf);
 show(x);requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.style.transform=`rotateY(${dir>0?-180:180}deg)`}));
 setTimeout(()=>leaf.remove(),750)}
bF.onclick=()=>go(0);bP.onclick=()=>go(s-1,-1);bN.onclick=()=>go(s+1,1);bL.onclick=()=>go(S);bT.onclick=()=>go(1);
document.addEventListener('click',e=>{const a=e.target.closest('[data-p]');if(a)go(Math.ceil(+a.dataset.p/2))});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(s+1,1);else if(e.key==='ArrowLeft')go(s-1,-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(S)});
function fit(){const k=Math.min(innerWidth/900,(innerHeight-64)/620);document.getElementById('stage').style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();show(0);
</script></body></html>
